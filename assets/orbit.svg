<svg width="820" height="480" viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="or-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E8C878" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8C878" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="480" fill="#F6F0E3"/>
  <ellipse cx="410" cy="240" rx="280" ry="220" fill="url(#or-glow)"/>

  <circle cx="410" cy="240" r="70" fill="none" stroke="#262119" stroke-opacity="0.12"/>
  <circle cx="410" cy="240" r="150" fill="none" stroke="#262119" stroke-opacity="0.09"/>
  <circle cx="410" cy="240" r="220" fill="none" stroke="#262119" stroke-opacity="0.06"/>

  <g text-anchor="middle" font-family="Helvetica, Arial, sans-serif">
    <circle cx="410" cy="240" r="48" fill="#FBF6E9" stroke="#D8C89C"/>
    <text x="410" y="236" font-size="17" font-weight="800" fill="#211C15" letter-spacing="1.5">CORE</text>
    <text x="410" y="253" font-size="9" fill="#8A7B5E" letter-spacing="1.5">SAMUDRA KAR</text>
  </g>

  <!-- ring 1 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 410 240" to="360 410 240" dur="46s" repeatCount="indefinite"/>

    <g transform="translate(560,240)">
      <line x1="-104" y1="0" x2="-48" y2="0" stroke="#262119" stroke-opacity="0.15"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="46s" repeatCount="indefinite"/>
        <circle r="4.5" fill="#B8902E"/><text x="13" y="5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2A2419">React</text></g>
    </g>
    <g transform="translate(410,390)">
      <line x1="0" y1="-104" x2="0" y2="-48" stroke="#262119" stroke-opacity="0.15"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="46s" repeatCount="indefinite"/>
        <circle r="4.5" fill="#B8902E"/><text x="0" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2A2419">Node</text></g>
    </g>
    <g transform="translate(260,240)">
      <line x1="104" y1="0" x2="48" y2="0" stroke="#262119" stroke-opacity="0.15"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="46s" repeatCount="indefinite"/>
        <circle r="4.5" fill="#B8902E"/><text x="-13" y="5" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2A2419">Tailwind</text></g>
    </g>
    <g transform="translate(410,90)">
      <line x1="0" y1="104" x2="0" y2="48" stroke="#262119" stroke-opacity="0.15"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="46s" repeatCount="indefinite"/>
        <circle r="4.5" fill="#B8902E"/><text x="0" y="-15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2A2419">Python</text></g>
    </g>
  </g>

  <!-- ring 2 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 410 240" to="0 410 240" dur="64s" repeatCount="indefinite"/>

    <g transform="translate(630,240)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#5C513E"/><text x="12" y="5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4133">TensorFlow</text></g>
    </g>
    <g transform="translate(520,410)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#5C513E"/><text x="12" y="5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4133">FastAPI</text></g>
    </g>
    <g transform="translate(300,410)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#5C513E"/><text x="-12" y="5" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4133">Figma</text></g>
    </g>
    <g transform="translate(190,240)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#5C513E"/><text x="-12" y="5" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4133">Git</text></g>
    </g>
    <g transform="translate(300,70)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#5C513E"/><text x="-12" y="5" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4133">MongoDB</text></g>
    </g>
    <g transform="translate(520,70)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#5C513E"/><text x="12" y="5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A4133">Three.js</text></g>
    </g>
  </g>

  <!-- drifting flecks -->
  <g fill="#262119">
    <circle cx="60" cy="60" r="1.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="90" r="1.1"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="420" r="1.4"><animate attributeName="opacity" values="0.08;0.45;0.08" dur="3.7s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="400" r="1.2"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
</svg>
