<svg width="820" height="480" viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="or-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="480" fill="#050505"/>
  <ellipse cx="410" cy="240" rx="280" ry="220" fill="url(#or-glow)"/>

  <circle cx="410" cy="240" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="410" cy="240" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="410" cy="240" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>

  <g text-anchor="middle" font-family="Helvetica, Arial, sans-serif">
    <circle cx="410" cy="240" r="46" fill="#0d0d0d" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="410" y="235" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.5">CORE</text>
    <text x="410" y="252" font-size="8.5" fill="#7a7a7a" letter-spacing="1.5">SAMUDRA KAR</text>
  </g>

  <!-- ring 1 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 410 240" to="360 410 240" dur="46s" repeatCount="indefinite"/>

    <g transform="translate(560,240)">
      <line x1="-104" y1="0" x2="-46" y2="0" stroke="#ffffff" stroke-opacity="0.12"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="46s" repeatCount="indefinite"/>
        <circle r="4" fill="#ffffff"/><text x="12" y="4" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e0e0e0">React</text></g>
    </g>
    <g transform="translate(410,390)">
      <line x1="0" y1="-104" x2="0" y2="-46" stroke="#ffffff" stroke-opacity="0.12"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="46s" repeatCount="indefinite"/>
        <circle r="4" fill="#ffffff"/><text x="0" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e0e0e0">Node</text></g>
    </g>
    <g transform="translate(260,240)">
      <line x1="104" y1="0" x2="46" y2="0" stroke="#ffffff" stroke-opacity="0.12"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="46s" repeatCount="indefinite"/>
        <circle r="4" fill="#ffffff"/><text x="-12" y="4" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e0e0e0">Tailwind</text></g>
    </g>
    <g transform="translate(410,90)">
      <line x1="0" y1="104" x2="0" y2="46" stroke="#ffffff" stroke-opacity="0.12"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="46s" repeatCount="indefinite"/>
        <circle r="4" fill="#ffffff"/><text x="0" y="-14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e0e0e0">Python</text></g>
    </g>
  </g>

  <!-- ring 2 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 410 240" to="0 410 240" dur="64s" repeatCount="indefinite"/>

    <g transform="translate(630,240)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#ffffff" fill-opacity="0.85"/><text x="12" y="4" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c4c4c4">TensorFlow</text></g>
    </g>
    <g transform="translate(520,410)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#ffffff" fill-opacity="0.85"/><text x="12" y="4" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c4c4c4">FastAPI</text></g>
    </g>
    <g transform="translate(300,410)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#ffffff" fill-opacity="0.85"/><text x="-12" y="4" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c4c4c4">Figma</text></g>
    </g>
    <g transform="translate(190,240)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#ffffff" fill-opacity="0.85"/><text x="-12" y="4" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c4c4c4">Git</text></g>
    </g>
    <g transform="translate(300,70)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#ffffff" fill-opacity="0.85"/><text x="-12" y="4" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c4c4c4">MongoDB</text></g>
    </g>
    <g transform="translate(520,70)">
      <g><animateTransform attributeName="transform" type="rotate" from="-360 0 0" to="0 0 0" dur="64s" repeatCount="indefinite"/>
        <circle r="4" fill="#ffffff" fill-opacity="0.85"/><text x="12" y="4" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c4c4c4">Three.js</text></g>
    </g>
  </g>

  <!-- drifting background stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="60" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="90" r="1.1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="420" r="1.4"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.7s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="400" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
</svg>
