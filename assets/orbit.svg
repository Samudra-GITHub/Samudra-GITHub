<svg width="620" height="300" viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="620" height="300" fill="#050505"/>

  <circle cx="310" cy="150" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
