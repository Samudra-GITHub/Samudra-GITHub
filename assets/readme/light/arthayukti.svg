<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" fill="none">
<title id="t">ArthaYukti</title>
<desc id="d">ArthaYukti: multi-goal financial planning under uncertainty. Goal bars fill, one goal slips and the smallest fix is found, while a trajectory draws. Illustrative artwork; nothing in it is live data.</desc>
