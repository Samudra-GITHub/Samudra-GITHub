<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" fill="none">
<title id="t">PRAHARI</title>
<desc id="d">PRAHARI: mine safety and compliance monitoring. A risk gauge swings and a tamper-evident audit log links block by block. Illustrative artwork; nothing in it is live data.</desc>
