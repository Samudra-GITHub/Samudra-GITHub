<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" fill="none">
<title id="t">Rinti AI</title>
<desc id="d">Rinti AI: a chat workspace with per-user memory and cited research. Chat bubbles and citation chips appear in turn. Illustrative artwork; nothing in it is live data.</desc>
