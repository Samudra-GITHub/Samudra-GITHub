<text x="230" y="156" class="m" font-size="13" fill="#0B1222" text-anchor="middle" letter-spacing=".08em">CLAUDE CODE</text><text x="230" y="175" class="m" font-size="10.5" fill="#55627C" text-anchor="middle">UI · UX · design tokens · docs</text>
