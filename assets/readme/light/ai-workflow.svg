<text x="500" y="62" class="m" font-size="13" fill="#0B1222" text-anchor="middle" letter-spacing=".08em">SAMUDRA</text><text x="500" y="81" class="m" font-size="10.5" fill="#55627C" text-anchor="middle">architecture · direction · validation</text>
