<text x="760" y="156" class="m" font-size="13" fill="#0B1222" text-anchor="middle" letter-spacing=".08em">ANTIGRAVITY</text><text x="760" y="175" class="m" font-size="10.5" fill="#55627C" text-anchor="middle">boot · memory · interrupts · scheduler · drivers</text>
<rect x="330" y="210" width="339" height="52" rx="14" fill="#F1F5FB" stroke="#15803D" stroke-width="1.5"/>
<text x="500" y="232" class="m" font-size="13" fill="#0B1222" text-anchor="middle" letter-spacing=".08em">SHARED REPOSITORY</text><text x="500" y="251" class="m" font-size="10.5" fill="#55627C" text-anchor="middle">docs · API contracts · handoff notes · commits</text>
<text x="40" y="40" class="m" font-size="10" fill="#A32F9A" letter-spacing=".18em">AI AGENTS, NOT PEOPLE</text>
