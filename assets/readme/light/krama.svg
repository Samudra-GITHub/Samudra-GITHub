<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" fill="none">
<title id="t">Krama</title>
<desc id="d">Krama: a luxury sneaker marketplace told as a story. A sneaker turns on a turntable while chapters slide past. Illustrative artwork; nothing in it is live data.</desc>
