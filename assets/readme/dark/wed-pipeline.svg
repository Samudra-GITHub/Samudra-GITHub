<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-labelledby="t d" fill="none">
<title id="t">Ask the Earth</title>
<desc id="d">Ask the Earth: you ask, the local model picks a tool, the capability broker checks it, the tool fetches public records with their source and time, and a typed request goes to the globe, which confirms it at the backend, app and globe. Anything with consequences waits for your approval. Illustrative artwork; nothing in it is live data.</desc>
<defs><pattern id="grid1" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22314F" stroke-opacity=".45" stroke-width="1"/></pattern><clipPath id="clip2"><rect width="1000" height="270" rx="22"/></clipPath></defs>
<style>
.m{font-family:ui-monospace,"JetBrains Mono","Cascadia Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-weight:600}
.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:500}
.fb{transform-box:fill-box;transform-origin:center}
.rise{animation:rise 14s cubic-bezier(.16,1,.3,1) infinite both}
@keyframes rise{0%{transform:translateY(110%)}6%,90%{transform:translateY(0)}96%,100%{transform:translateY(110%)}}
.flow{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
.tw{animation:tw 3.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 2.8s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes rip{0%{transform:scale(.25);opacity:.95}100%{transform:scale(2.8);opacity:0}}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.22)}to{transform:scaleY(1)}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 7s cubic-bezier(.65,0,.35,1) infinite}
@keyframes grow{0%{transform:scaleX(0)}35%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.draw{stroke-dasharray:100;animation:draw 7s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:100}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
.glow{animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:1}}
.steam{transform-box:fill-box;transform-origin:50% 100%;animation:steam 3.6s ease-out infinite}
@keyframes steam{0%{transform:translateY(8px) scaleY(.6);opacity:0}30%{opacity:.9}100%{transform:translateY(-18px) scaleY(1.1);opacity:0}}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
.drip{transform-box:fill-box;transform-origin:50% 0;animation:drip 4.5s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(.15)}60%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
.shim{animation:shim 2.6s ease-in-out infinite}
@keyframes shim{0%{transform:translateX(-120px)}100%{transform:translateX(330px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.pn0{opacity:1;animation:pn0 6s linear infinite}@keyframes pn0{0%,16.17%{opacity:1}16.67%,99.50%{opacity:0}100%{opacity:1}}.pn1{opacity:0;animation:pn1 6s linear infinite}@keyframes pn1{0%,16.67%{opacity:0}17.17%,32.83%{opacity:1}33.33%,100%{opacity:0}}.pn2{opacity:0;animation:pn2 6s linear infinite}@keyframes pn2{0%,33.33%{opacity:0}33.83%,49.50%{opacity:1}50.00%,100%{opacity:0}}.pn3{opacity:0;animation:pn3 6s linear infinite}@keyframes pn3{0%,50.00%{opacity:0}50.50%,66.17%{opacity:1}66.67%,100%{opacity:0}}.pn4{opacity:0;animation:pn4 6s linear infinite}@keyframes pn4{0%,66.67%{opacity:0}67.17%,82.83%{opacity:1}83.33%,100%{opacity:0}}.pn5{opacity:0;animation:pn5 6s linear infinite}@keyframes pn5{0%,83.33%{opacity:0}83.83%,99.50%{opacity:1}100.00%,100%{opacity:0}}.ck0{animation:ck0 6s cubic-bezier(.16,1,.3,1) infinite}@keyframes ck0{0%,2.0%{opacity:0;transform:translateY(8px)}8.0%,90.0%{opacity:1;transform:translateY(0)}95.0%,100%{opacity:0;transform:translateY(0)}}.ck1{animation:ck1 6s cubic-bezier(.16,1,.3,1) infinite}@keyframes ck1{0%,14.0%{opacity:0;transform:translateY(8px)}20.0%,90.0%{opacity:1;transform:translateY(0)}95.0%,100%{opacity:0;transform:translateY(0)}}.ck2{animation:ck2 6s cubic-bezier(.16,1,.3,1) infinite}@keyframes ck2{0%,26.0%{opacity:0;transform:translateY(8px)}32.0%,90.0%{opacity:1;transform:translateY(0)}95.0%,100%{opacity:0;transform:translateY(0)}}</style>
<rect x=".75" y=".75" width="998.5" height="268.5" rx="22" fill="#0A1020"/>
<rect width="1000" height="270" fill="url(#grid1)" clip-path="url(#clip2)" opacity=".55"/>
<text x="40" y="50" class="m" font-size="12" fill="#5CC8FF" letter-spacing=".2em">ASK THE EARTH</text><text x="160" y="50" class="s" font-size="13" fill="#8E9BB6">how a question becomes a confirmed action on the globe</text>
<path d="M110.0 122H890.0" stroke="#22314F" stroke-width="2"/><path d="M110.0 122H890.0" stroke="#5CC8FF" stroke-width="2" class="flow"/>
<g><circle r="5" fill="#5CC8FF"/><circle r="9" fill="#5CC8FF" fill-opacity=".2"/><animateMotion dur="6s" begin="-0.00s" repeatCount="indefinite" path="M110.0 122H890.0"/></g>
<g><circle r="5" fill="#5CC8FF"/><circle r="9" fill="#5CC8FF" fill-opacity=".2"/><animateMotion dur="6s" begin="-2.00s" repeatCount="indefinite" path="M110.0 122H890.0"/></g>
<g><circle r="5" fill="#5CC8FF"/><circle r="9" fill="#5CC8FF" fill-opacity=".2"/><animateMotion dur="6s" begin="-4.00s" repeatCount="indefinite" path="M110.0 122H890.0"/></g>
<rect x="40" y="82" width="140" height="80" rx="14" fill="#101A2E" stroke="#22314F"/>
<g class="pn0"><rect x="40" y="82" width="140" height="80" rx="14" stroke="#5CC8FF" stroke-width="1.8"/></g>
<text x="54" y="104" class="m" font-size="10" fill="#5CC8FF" letter-spacing=".1em">01</text><text x="54" y="129" class="m" font-size="12.5" fill="#E8EEF9" letter-spacing=".04em">YOU ASK</text><text x="54" y="148" class="s" font-size="11" fill="#8E9BB6">type or speak</text>
<rect x="196" y="82" width="140" height="80" rx="14" fill="#101A2E" stroke="#22314F"/>
<g class="pn1"><rect x="196" y="82" width="140" height="80" rx="14" stroke="#5CC8FF" stroke-width="1.8"/></g>
<text x="210" y="104" class="m" font-size="10" fill="#5CC8FF" letter-spacing=".1em">02</text><text x="210" y="129" class="m" font-size="12.5" fill="#E8EEF9" letter-spacing=".04em">LOCAL MODEL</text><text x="210" y="148" class="s" font-size="11" fill="#8E9BB6">Ollama · qwen2.5:7b</text>
<rect x="352" y="82" width="140" height="80" rx="14" fill="#101A2E" stroke="#22314F"/>
<g class="pn2"><rect x="352" y="82" width="140" height="80" rx="14" stroke="#5CC8FF" stroke-width="1.8"/></g>
<text x="366" y="104" class="m" font-size="10" fill="#5CC8FF" letter-spacing=".1em">03</text><text x="366" y="129" class="m" font-size="12.5" fill="#E8EEF9" letter-spacing=".04em">BROKER</text><text x="366" y="148" class="s" font-size="11" fill="#8E9BB6">deny by default</text>
<rect x="508" y="82" width="140" height="80" rx="14" fill="#101A2E" stroke="#22314F"/>
<g class="pn3"><rect x="508" y="82" width="140" height="80" rx="14" stroke="#5CC8FF" stroke-width="1.8"/></g>
<text x="522" y="104" class="m" font-size="10" fill="#5CC8FF" letter-spacing=".1em">04</text><text x="522" y="129" class="m" font-size="12.5" fill="#E8EEF9" letter-spacing=".04em">TOOL</text><text x="522" y="148" class="s" font-size="11" fill="#8E9BB6">public source + time</text>
<rect x="664" y="82" width="140" height="80" rx="14" fill="#101A2E" stroke="#22314F"/>
<g class="pn4"><rect x="664" y="82" width="140" height="80" rx="14" stroke="#5CC8FF" stroke-width="1.8"/></g>
<text x="678" y="104" class="m" font-size="10" fill="#5CC8FF" letter-spacing=".1em">05</text><text x="678" y="129" class="m" font-size="12.5" fill="#E8EEF9" letter-spacing=".04em">TYPED REQUEST</text><text x="678" y="148" class="s" font-size="11" fill="#8E9BB6">fixed list of actions</text>
<rect x="820" y="82" width="140" height="80" rx="14" fill="#101A2E" stroke="#22314F"/>
<g class="pn5"><rect x="820" y="82" width="140" height="80" rx="14" stroke="#5CC8FF" stroke-width="1.8"/></g>
