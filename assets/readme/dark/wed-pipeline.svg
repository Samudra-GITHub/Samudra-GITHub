<g class="ck1"><circle cx="888" cy="206" r="9" fill="#4ADE80" fill-opacity=".15" stroke="#4ADE80"/><path d="M884 206l3 3 6-6" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="888" y="230" class="m" font-size="8.5" fill="#8E9BB6" text-anchor="middle" letter-spacing=".06em">APP</text></g>
<g class="ck2"><circle cx="932" cy="206" r="9" fill="#4ADE80" fill-opacity=".15" stroke="#4ADE80"/><path d="M928 206l3 3 6-6" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="932" y="230" class="m" font-size="8.5" fill="#8E9BB6" text-anchor="middle" letter-spacing=".06em">GLOBE</text></g>
