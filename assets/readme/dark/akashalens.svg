<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" fill="none">
<title id="t">AkashaLens</title>
<desc id="d">AkashaLens: a U-Net that reconstructs cloud-covered Sentinel-2 scenes. A scan line sweeps across a satellite tile and clears the clouds. Illustrative artwork; nothing in it is live data.</desc>
