<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" fill="none">
<title id="t">Niriksh AI</title>
<desc id="d">Niriksh AI: an AI operations teammate for merchants. Example tasks move from queued to done. Illustrative artwork; nothing in it is live data.</desc>
