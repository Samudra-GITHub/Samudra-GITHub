<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" fill="none">
<title id="t">SkyCast</title>
<desc id="d">SkyCast: one screen of weather. A sun turns, a cloud drifts, and temperature, UV and air-quality bars fill. Illustrative artwork; nothing in it is live data.</desc>
