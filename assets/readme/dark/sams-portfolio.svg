<title id="t">Sam's Portfolio</title>
<desc id="d">Sam's Portfolio: a WebGL glass-drop homepage and an exhibition of 16 projects. A glass drop ripples while sixteen tiles light up. Illustrative artwork; nothing in it is live data.</desc>
