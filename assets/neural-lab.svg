    </circle>
  </g>

  <g fill="#211C15">
    <circle cx="110" cy="60" r="3.6"/><circle cx="110" cy="130" r="3.6"/><circle cx="110" cy="200" r="3.6"/>
    <circle cx="300" cy="90" r="3.6"/><circle cx="300" cy="160" r="3.6"/>
