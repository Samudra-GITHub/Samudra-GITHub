      <stop offset="0%" stop-color="#E8C878" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E8C878" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="260" fill="#F6F0E3"/>
  <ellipse cx="410" cy="130" rx="380" ry="140" fill="url(#nl-glow)"/>

  <g stroke="#262119" stroke-opacity="0.16">
    <line x1="110" y1="60" x2="300" y2="90"/>
    <line x1="110" y1="130" x2="300" y2="90"/>
    <line x1="110" y1="200" x2="300" y2="160"/>
    <line x1="110" y1="130" x2="300" y2="160"/>
    <line x1="300" y1="90" x2="500" y2="70"/>
    <line x1="300" y1="90" x2="500" y2="130"/>
    <line x1="300" y1="160" x2="500" y2="130"/>
    <line x1="300" y1="160" x2="500" y2="190"/>
    <line x1="500" y1="70" x2="700" y2="110"/>
    <line x1="500" y1="130" x2="700" y2="110"/>
    <line x1="500" y1="130" x2="700" y2="160"/>
