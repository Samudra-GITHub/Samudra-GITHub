<svg width="400" height="220" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ak-glow" cx="30%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="220" fill="#0a0a0a"/>
  <rect width="400" height="220" fill="url(#ak-glow)"/>

  <!-- planet -->
  <circle cx="130" cy="115" r="62" fill="none" stroke="#ffffff" stroke-opacity="0.5"/>
  <ellipse cx="130" cy="115" rx="62" ry="18" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  <ellipse cx="130" cy="115" rx="62" ry="34" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <path d="M 68 115 L 192 115" stroke="#ffffff" stroke-opacity="0.2"/>
  <path d="M 130 53 L 130 177" stroke="#ffffff" stroke-opacity="0.2"/>

  <!-- cloud occlusion patches reconstructing -->
  <rect x="105" y="95" width="26" height="14" rx="3" fill="#ffffff" opacity="0.5">
    <animate attributeName="opacity" values="0.55;0.12;0.55" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="140" y="120" width="20" height="12" rx="3" fill="#ffffff" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="4s" begin="0.5s" repeatCount="indefinite"/>
  </rect>

  <!-- orbiting satellite -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 115" to="360 130 115" dur="10s" repeatCount="indefinite"/>
    <circle cx="205" cy="115" r="3" fill="#ffffff"/>
    <rect x="200" y="110" width="4" height="10" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <!-- neural net corner -->
  <g stroke="#ffffff" stroke-opacity="0.35">
    <line x1="300" y1="40" x2="330" y2="55"/>
    <line x1="300" y1="70" x2="330" y2="55"/>
    <line x1="330" y1="55" x2="365" y2="40"/>
    <line x1="330" y1="55" x2="365" y2="70"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="40" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="70" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="55" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="365" cy="40" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="365" cy="70" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <text x="300" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8a8a8a">SATELLITE &#183; CLOUD RECONSTRUCTION</text>
</svg>
