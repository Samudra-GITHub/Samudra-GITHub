<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tl-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="900" height="340" fill="#050505"/>

  <line x1="40" y1="210" x2="860" y2="210" stroke="url(#tl-line)" stroke-width="1.4" stroke-dasharray="820" stroke-dashoffset="820">
    <animate attributeName="stroke-dashoffset" from="820" to="0" dur="2.6s" begin="0.1s" fill="freeze"/>
  </line>

  <!-- 2022 -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/>
    <text x="120" y="160" font-size="42" font-weight="800" fill="#ffffff" opacity="0.9">22</text>
    <circle cx="120" cy="210" r="5" fill="#ffffff"/>
    <text x="120" y="245" font-size="11" fill="#a0a0a0" letter-spacing="0.5">Started Computer</text>
    <text x="120" y="260" font-size="11" fill="#a0a0a0" letter-spacing="0.5">Science Engineering</text>
  </g>

  <!-- 2023 -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
    <text x="290" y="160" font-size="42" font-weight="800" fill="#ffffff" opacity="0.9">23</text>
    <circle cx="290" cy="210" r="5" fill="#ffffff"/>
    <text x="290" y="245" font-size="11" fill="#a0a0a0" letter-spacing="0.5">Learned UI/UX</text>
    <text x="290" y="260" font-size="11" fill="#a0a0a0" letter-spacing="0.5">design fundamentals</text>
  </g>

  <!-- 2024 -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
    <!-- weather glyph -->
    <ellipse cx="452" cy="128" rx="16" ry="7" fill="none" stroke="#c8c8c8" stroke-opacity="0.7"/>
    <text x="460" y="160" font-size="42" font-weight="800" fill="#ffffff" opacity="0.9">24</text>
    <circle cx="460" cy="210" r="5" fill="#ffffff"/>
    <text x="460" y="245" font-size="11" fill="#a0a0a0" letter-spacing="0.5">Built SkyCast &amp; first</text>
    <text x="460" y="260" font-size="11" fill="#a0a0a0" letter-spacing="0.5">full-stack products</text>
  </g>

  <!-- 2025 -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.2s" fill="freeze"/>
    <!-- sneaker tick glyph -->
    <path d="M618,124 C624,120 632,120 640,124 L645,130 L615,130 Z" fill="none" stroke="#c8c8c8" stroke-opacity="0.7"/>
    <text x="630" y="160" font-size="42" font-weight="800" fill="#ffffff" opacity="0.9">25</text>
    <circle cx="630" cy="210" r="5" fill="#ffffff"/>
    <text x="630" y="245" font-size="11" fill="#a0a0a0" letter-spacing="0.5">Krama, AkashaLens</text>
    <text x="630" y="260" font-size="11" fill="#a0a0a0" letter-spacing="0.5">&amp; Smart India Hackathon</text>
  </g>

  <!-- NOW -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.5s" fill="freeze"/>
    <!-- satellite glyph -->
    <circle cx="780" cy="126" r="5" fill="none" stroke="#c8c8c8" stroke-opacity="0.7"/>
    <line x1="774" y1="120" x2="769" y2="115" stroke="#c8c8c8" stroke-opacity="0.7"/>
    <line x1="786" y1="132" x2="791" y2="137" stroke="#c8c8c8" stroke-opacity="0.7"/>
    <text x="800" y="160" font-size="34" font-weight="800" fill="#ffffff">NOW</text>
    <circle cx="800" cy="210" r="10" fill="none" stroke="#ffffff" stroke-width="1">
      <animate attributeName="r" values="10;18;10" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="210" r="6" fill="#ffffff"/>
    <text x="800" y="245" font-size="11" fill="#a0a0a0" letter-spacing="0.5">AI &amp; Computer Vision</text>
  </g>
</svg>
