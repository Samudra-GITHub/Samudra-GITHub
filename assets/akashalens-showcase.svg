<svg width="620" height="460" viewBox="0 0 620 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ak-glow" cx="35%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C66A2E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C66A2E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="620" height="460" fill="#EFE6DA"/>
  <ellipse cx="240" cy="220" rx="260" ry="200" fill="url(#ak-glow)"/>

  <text x="40" y="44" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#75695E">AKASHALENS</text>
  <text x="580" y="44" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#C66A2E">ISRO HACKATHON</text>
  <line x1="40" y1="56" x2="580" y2="56" stroke="#2D241F" stroke-opacity="0.1"/>

  <!-- earth -->
  <circle cx="240" cy="230" r="120" fill="none" stroke="#2D241F" stroke-opacity="0.5"/>
  <ellipse cx="240" cy="230" rx="120" ry="34" fill="none" stroke="#2D241F" stroke-opacity="0.2"/>
  <ellipse cx="240" cy="230" rx="120" ry="64" fill="none" stroke="#2D241F" stroke-opacity="0.14"/>
  <path d="M 120 230 L 360 230" stroke="#2D241F" stroke-opacity="0.16"/>
  <path d="M 240 110 L 240 350" stroke="#2D241F" stroke-opacity="0.16"/>

  <!-- occlusion reconstruction patches -->
  <rect x="200" y="190" width="50" height="26" rx="5" fill="#C66A2E" opacity="0.45">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="270" y="250" width="36" height="20" rx="5" fill="#C66A2E" opacity="0.3">
    <animate attributeName="opacity" values="0.12;0.45;0.12" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- orbiting satellite -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 240 230" to="360 240 230" dur="9s" repeatCount="indefinite"/>
    <circle cx="375" cy="230" r="3.6" fill="#2D241F"/>
    <rect x="369" y="224" width="4" height="12" fill="#2D241F" fill-opacity="0.5"/>
  </g>

  <!-- earth texture doodle stars -->
  <g fill="#75695E" opacity="0.6">
    <circle cx="80" cy="90" r="1.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="120" r="1.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="340" r="1.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <text x="40" y="428" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#75695E">AI-POWERED SATELLITE CLOUD RECONSTRUCTION.</text>
</svg>
