<svg width="620" height="460" viewBox="0 0 620 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tg-glow" cx="35%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C66A2E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C66A2E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="620" height="460" fill="#EFE6DA"/>
  <ellipse cx="230" cy="220" rx="260" ry="200" fill="url(#tg-glow)"/>

  <text x="40" y="44" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#75695E">TARANG</text>
  <text x="580" y="44" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#C66A2E">LIVE ON DEV</text>
  <line x1="40" y1="56" x2="580" y2="56" stroke="#2D241F" stroke-opacity="0.1"/>

  <!-- vinyl record -->
  <g transform="translate(210,230)">
    <circle r="120" fill="#2D241F"/>
    <circle r="120" fill="none" stroke="#F8F4EC" stroke-opacity="0.06" stroke-width="1"/>
    <circle r="98" fill="none" stroke="#F8F4EC" stroke-opacity="0.08"/>
    <circle r="78" fill="none" stroke="#F8F4EC" stroke-opacity="0.08"/>
    <circle r="58" fill="none" stroke="#F8F4EC" stroke-opacity="0.08"/>
    <circle r="38" fill="#C66A2E"/>
    <circle r="6" fill="#EFE6DA"/>
    <animateTransform attributeName="transform" type="rotate" from="0 210 230" to="360 210 230" dur="10s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- tonearm -->
  <g stroke="#2D241F" stroke-width="3" stroke-linecap="round">
    <line x1="380" y1="120" x2="300" y2="200"/>
    <circle cx="380" cy="120" r="7" fill="#2D241F"/>
  </g>

  <!-- waveform -->
  <g stroke="#C66A2E" stroke-width="3" stroke-linecap="round">
    <line x1="70" y1="360" x2="70" y2="380"><animate attributeName="y1" values="360;340;360" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="90" y1="350" x2="90" y2="390"><animate attributeName="y1" values="350;320;350" dur="1.4s" begin="0.1s" repeatCount="indefinite"/></line>
    <line x1="110" y1="365" x2="110" y2="380"><animate attributeName="y1" values="365;345;365" dur="1.1s" begin="0.2s" repeatCount="indefinite"/></line>
    <line x1="130" y1="345" x2="130" y2="390"><animate attributeName="y1" values="345;315;345" dur="1.3s" begin="0.3s" repeatCount="indefinite"/></line>
    <line x1="150" y1="358" x2="150" y2="385"><animate attributeName="y1" values="358;330;358" dur="1.5s" begin="0.15s" repeatCount="indefinite"/></line>
    <line x1="170" y1="368" x2="170" y2="378"><animate attributeName="y1" values="368;350;368" dur="1s" begin="0.25s" repeatCount="indefinite"/></line>
  </g>

  <!-- floating music notes -->
  <g fill="#2D241F" opacity="0.5" font-family="Georgia, serif" font-size="22">
    <text x="470" y="200">&#9835;<animateTransform attributeName="transform" type="translate" values="0,0; 0,-14; 0,0" dur="4s" repeatCount="indefinite"/></text>
    <text x="510" y="270">&#9834;<animateTransform attributeName="transform" type="translate" values="0,0; 0,12; 0,0" dur="5s" begin="0.6s" repeatCount="indefinite"/></text>
  </g>

  <text x="40" y="428" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#75695E">MUSIC, REDESIGNED FOR THE WEB.</text>
</svg>
