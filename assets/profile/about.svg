<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="ab-t ab-d">
<title id="ab-t">Samudra Kar</title>
<desc id="ab-d">SAMUDRA KAR. Computer Science engineering student building across systems, AI and product, from first principles. A chrome-yellow disc with a 64-bit CPU outline, tilted project cards for Tarang, Rinti AI and AkashaLens, and a running strip of boot instructions. Bangalore, India. Open to internships.</desc>
