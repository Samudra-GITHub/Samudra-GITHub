<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="ab-t ab-d">
<title id="ab-t">Samudra Kar</title>
<desc id="ab-d">Samudra Kar. Computer Science engineering student building across systems, AI and product, from first principles. Bangalore, India. Chanakya University. Open to internships.</desc>
<defs>
<pattern id="ab-g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#131923" stroke-width="1"/></pattern>
<radialGradient id="ab-glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#5FD4C8" stop-opacity=".16"/><stop offset="1" stop-color="#5FD4C8" stop-opacity="0"/></radialGradient>
<linearGradient id="ab-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FD4C8" stop-opacity="0"/><stop offset=".85" stop-color="#5FD4C8" stop-opacity=".14"/><stop offset="1" stop-color="#5FD4C8" stop-opacity=".5"/></linearGradient>
<clipPath id="ab-clip"><rect width="1000" height="440" rx="18"/></clipPath>

</defs>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.k{letter-spacing:.14em}
.flow{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.scan{animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(640px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.pl{animation:pl 12s ease-out infinite both}
@keyframes pl{0%{opacity:0;transform:translateY(22px)}6%{opacity:1;transform:translateY(0)}90%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.tr{stroke-dasharray:5 7;animation:flow 1.4s linear infinite}
.nd{animation:nd 3.2s ease-in-out infinite}
@keyframes nd{0%,100%{opacity:.55}50%{opacity:1}}
.rv{animation:rv 12s ease-out infinite both}
@keyframes rv{0%{opacity:0;transform:translateX(-14px)}5%{opacity:1;transform:translateX(0)}92%{opacity:1}100%{opacity:0}}
</style>
<g clip-path="url(#ab-clip)">
<rect width="1000" height="440" fill="#090B10"/>
<rect width="1000" height="440" fill="url(#ab-g)"/>
<rect width="1000" height="440" fill="url(#ab-glow)"/>
<path class="tr" d="M904 353.0 V143.0" stroke="#5FD4C8" stroke-width="1.5" fill="none" opacity=".9"/><g class="pl" style="animation-delay:1.35s"><polygon points="680,118 950,118 910,168 640,168" fill="#0E121A" stroke="#8CC8FF" stroke-opacity=".75"/><polygon points="640,168 910,168 910,175 640,175" fill="#8CC8FF" fill-opacity=".14"/><text class="m k" x="672.0" y="140" font-size="12.5" fill="#EAF0F8">PRODUCT ENGINEERING</text><text class="m" x="672.0" y="157" font-size="11" fill="#8E99AD">interfaces people use</text><circle class="nd" cx="904" cy="143.0" r="0" fill="#8CC8FF"/></g><g class="pl" style="animation-delay:0.90s"><polygon points="680,188 950,188 910,238 640,238" fill="#0E121A" stroke="#A99BFF" stroke-opacity=".75"/><polygon points="640,238 910,238 910,245 640,245" fill="#A99BFF" fill-opacity=".14"/><text class="m k" x="672.0" y="210" font-size="12.5" fill="#EAF0F8">AI + COMPUTER VISION</text><text class="m" x="672.0" y="227" font-size="11" fill="#8E99AD">models, pipelines, APIs</text><circle class="nd" cx="904" cy="213.0" r="0" fill="#A99BFF"/></g><g class="pl" style="animation-delay:0.45s"><polygon points="680,258 950,258 910,308 640,308" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".75"/><polygon points="640,308 910,308 910,315 640,315" fill="#5FD4C8" fill-opacity=".14"/><text class="m k" x="672.0" y="280" font-size="12.5" fill="#EAF0F8">SYSTEMS + KERNEL</text><text class="m" x="672.0" y="297" font-size="11" fill="#8E99AD">memory, interrupts, schedulers</text><circle class="nd" cx="904" cy="283.0" r="0" fill="#5FD4C8"/></g><g class="pl" style="animation-delay:0.00s"><polygon points="680,328 950,328 910,378 640,378" fill="#0E121A" stroke="#8E99AD" stroke-opacity=".75"/><polygon points="640,378 910,378 910,385 640,385" fill="#8E99AD" fill-opacity=".14"/><text class="m k" x="672.0" y="350" font-size="12.5" fill="#EAF0F8">x86-64 HARDWARE</text><text class="m" x="672.0" y="367" font-size="11" fill="#8E99AD">first principles start here</text><circle class="nd" cx="904" cy="353.0" r="0" fill="#8E99AD"/></g><circle class="nd" style="animation-delay:0.0s" cx="904" cy="143.0" r="3.5" fill="#5FD4C8"/><circle class="nd" style="animation-delay:0.5s" cx="904" cy="213.0" r="3.5" fill="#5FD4C8"/><circle class="nd" style="animation-delay:1.0s" cx="904" cy="283.0" r="3.5" fill="#5FD4C8"/><circle class="nd" style="animation-delay:1.5s" cx="904" cy="353.0" r="3.5" fill="#5FD4C8"/><circle r="3.6" fill="#C9FFF8" opacity="0"><animateMotion dur="4.2s" begin="0.6s" repeatCount="indefinite" path="M904 353.0 V143.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4.2s" begin="0.6s" repeatCount="indefinite"/></circle><text class="m" x="964" y="132" font-size="10.5" fill="#566075">y+3</text><text class="m" x="924" y="400" font-size="10.5" fill="#566075">y+0 · ground truth</text><g class="rv"><text class="m k" x="56" y="98" font-size="12.5" fill="#5FD4C8">SAMUDRA KAR  /  BOOT ▸ PROFILE</text><circle class="blink" cx="40" cy="94" r="3.5" fill="#5FD4C8"/></g><g class="rv" style="animation-delay:.25s"><text x="54" y="190" font-size="90" font-weight="700" fill="#EAF0F8" letter-spacing="-3">Samudra</text><text x="54" y="272" font-size="90" font-weight="700" fill="#EAF0F8" letter-spacing="-3">Kar<tspan fill="#5FD4C8">.</tspan></text></g><g class="rv" style="animation-delay:.55s"><text x="56" y="316" font-size="25" fill="#B8C2D4">Computer Science engineering student</text><text class="m" x="56" y="348" font-size="15" fill="#8E99AD">systems  ·  AI  ·  product engineering</text></g><g class="rv" style="animation-delay:.9s"><text class="m" x="56" y="394" font-size="17" fill="#5FD4C8">$ build --from-first-principles</text><rect class="blink" x="376" y="381" width="9" height="16" fill="#5FD4C8"/></g><g transform="translate(900 66)"><path d="M0 0H34M0 0V34M60 0H34M60 0V12" fill="none" stroke="#5FD4C8" stroke-width="2"/><text class="m" x="30" y="40" font-size="26" font-weight="700" fill="#EAF0F8" text-anchor="middle">SK</text></g>

<rect width="1000" height="44" fill="#0C1017"/>
<path d="M0 44.5H1000" stroke="#1D2431"/>
<rect x="28" y="19" width="6" height="6" fill="#5FD4C8"/>
<text class="m k" x="44" y="26" font-size="11.5" fill="#8E99AD">SAMUDRA·KAR  //  PROFILE</text>
<text class="m k" x="972" y="26" font-size="11.5" fill="#566075" text-anchor="end">BANGALORE · IN</text>
<text class="m" x="28" y="424" font-size="11" fill="#566075">Stylised boot sequence. Not live telemetry.</text>
