<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="ri-t ri-d">
<title id="ri-t">Rinti AI</title>
<desc id="ri-d">Rinti AI: a research chat workspace. A question flows through intent detection, query planning, search, page extraction, claim evaluation and synthesis, drawing on four numbered sources and producing a typeset answer with numbered citations. Account sessions use Argon2 password hashing, HttpOnly cookies and CSRF checks, with per-user memory and daily caps.</desc>
