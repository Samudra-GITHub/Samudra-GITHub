<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="ri-t ri-d">
<title id="ri-t">Rinti AI</title>
<desc id="ri-d">Rinti AI: a product workflow view. A question moves through intent detection, query planning, search, page extraction, claim evaluation and synthesis, drawing on numbered sources and producing an answer with numbered citations. Account sessions use Argon2 hashing, HttpOnly cookies and CSRF checks.</desc>
<defs>
<pattern id="ri-g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#131923" stroke-width="1"/></pattern>
<radialGradient id="ri-glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#8CC8FF" stop-opacity=".16"/><stop offset="1" stop-color="#8CC8FF" stop-opacity="0"/></radialGradient>
<linearGradient id="ri-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CC8FF" stop-opacity="0"/><stop offset=".85" stop-color="#8CC8FF" stop-opacity=".14"/><stop offset="1" stop-color="#8CC8FF" stop-opacity=".5"/></linearGradient>
<clipPath id="ri-clip"><rect width="1000" height="540" rx="18"/></clipPath>

</defs>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.k{letter-spacing:.14em}
.flow{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.scan{animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(640px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.st{animation:st 12s ease-in-out infinite both}
@keyframes st{0%{stroke:#2A3345;fill:#0B0F16}6%,14%{stroke:#8CC8FF;fill:#0F1A26}22%,100%{stroke:#2A3345;fill:#0B0F16}}
.ci{animation:ci 12s ease-out infinite both}
@keyframes ci{0%,55%{opacity:0;transform:scale(.6)}62%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}
.ty{animation:ty 12s steps(1) infinite}
</style>
<g clip-path="url(#ri-clip)">
<rect width="1000" height="540" fill="#090B10"/>
<rect width="1000" height="540" fill="url(#ri-g)"/>
<rect width="1000" height="540" fill="url(#ri-glow)"/>
<text x="40" y="94" font-size="38" font-weight="700" fill="#EAF0F8">Rinti AI</text><text class="m" x="42" y="120" font-size="13" fill="#8E99AD">research chat workspace · per-user memory · cited multi-step research</text><rect x="716" y="72" width="244" height="30" rx="15" fill="#0E121A" stroke="#8CC8FF" stroke-opacity=".7"/><text class="m k" x="838" y="91" font-size="11" fill="#8CC8FF" text-anchor="middle">PRODUCT WORKFLOW VIEW</text><rect x="40" y="144" width="190" height="290" rx="10" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="56" y="168" font-size="11" fill="#8CC8FF">01 · QUESTION</text><rect x="56" y="180" width="158" height="46" rx="6" fill="#0B0F16" stroke="#2A3345"/><rect x="68" y="192" width="117" height="4" rx="2" fill="#B8C2D4" opacity=".55"/><rect x="68" y="203" width="86" height="4" rx="2" fill="#B8C2D4" opacity=".55"/><rect x="68" y="214" width="101" height="4" rx="2" fill="#B8C2D4" opacity=".55"/><text class="m" x="56" y="256" font-size="10.5" fill="#8E99AD">user asks a question</text><text class="m" x="56" y="278" font-size="10.5" fill="#566075">per-user memory</text><rect x="56" y="288" width="158" height="34" rx="6" fill="none" stroke="#2A3345" stroke-dasharray="3 4"/><text class="m" x="68" y="309" font-size="10.5" fill="#8E99AD">memory items</text><text class="m" x="56" y="352" font-size="10.5" fill="#566075">Quick or Standard</text><text class="m" x="56" y="368" font-size="10.5" fill="#566075">research budget</text><rect x="250" y="144" width="260" height="290" rx="10" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="266" y="168" font-size="11" fill="#8CC8FF">02 · PIPELINE STAGES</text><rect class="st" style="animation-delay:0.0s" x="266" y="184" width="228" height="32" rx="6" fill="#0B0F16" stroke="#2A3345" stroke-width="1.2"/><text class="m" x="280" y="205" font-size="9.5" fill="#566075">01</text><text class="m" x="308" y="205" font-size="12.5" fill="#EAF0F8">intent detection</text><path d="M380 216v8" stroke="#8CC8FF" stroke-opacity=".6"/><rect class="st" style="animation-delay:1.8s" x="266" y="224" width="228" height="32" rx="6" fill="#0B0F16" stroke="#2A3345" stroke-width="1.2"/><text class="m" x="280" y="245" font-size="9.5" fill="#566075">02</text><text class="m" x="308" y="245" font-size="12.5" fill="#EAF0F8">query planning</text><path d="M380 256v8" stroke="#8CC8FF" stroke-opacity=".6"/><rect class="st" style="animation-delay:3.6s" x="266" y="264" width="228" height="32" rx="6" fill="#0B0F16" stroke="#2A3345" stroke-width="1.2"/><text class="m" x="280" y="285" font-size="9.5" fill="#566075">03</text><text class="m" x="308" y="285" font-size="12.5" fill="#EAF0F8">search</text><path d="M380 296v8" stroke="#8CC8FF" stroke-opacity=".6"/><rect class="st" style="animation-delay:5.4s" x="266" y="304" width="228" height="32" rx="6" fill="#0B0F16" stroke="#2A3345" stroke-width="1.2"/><text class="m" x="280" y="325" font-size="9.5" fill="#566075">04</text><text class="m" x="308" y="325" font-size="12.5" fill="#EAF0F8">page extraction</text><path d="M380 336v8" stroke="#8CC8FF" stroke-opacity=".6"/><rect class="st" style="animation-delay:7.2s" x="266" y="344" width="228" height="32" rx="6" fill="#0B0F16" stroke="#2A3345" stroke-width="1.2"/><text class="m" x="280" y="365" font-size="9.5" fill="#566075">05</text><text class="m" x="308" y="365" font-size="12.5" fill="#EAF0F8">claim evaluation</text><path d="M380 376v8" stroke="#8CC8FF" stroke-opacity=".6"/><rect class="st" style="animation-delay:9.0s" x="266" y="384" width="228" height="32" rx="6" fill="#0B0F16" stroke="#2A3345" stroke-width="1.2"/><text class="m" x="280" y="405" font-size="9.5" fill="#566075">06</text><text class="m" x="308" y="405" font-size="12.5" fill="#EAF0F8">synthesis</text><rect x="530" y="144" width="200" height="290" rx="10" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="546" y="168" font-size="11" fill="#8CC8FF">03 · SOURCES</text><rect x="546" y="172" width="168" height="52" rx="6" fill="#0B0F16" stroke="#2A3345"/><circle cx="566" cy="198" r="10" fill="#8CC8FF" fill-opacity=".15" stroke="#8CC8FF"/><text class="m" x="566" y="202" font-size="11" fill="#8CC8FF" text-anchor="middle">1</text><rect x="586" y="186" width="110" height="4" rx="2" fill="#B8C2D4" opacity=".55"/><rect x="586" y="198" width="86" height="4" rx="2" fill="#566075"/><rect x="586" y="208" width="60" height="4" rx="2" fill="#566075"/><rect x="546" y="234" width="168" height="52" rx="6" fill="#0B0F16" stroke="#2A3345"/><circle cx="566" cy="260" r="10" fill="#8CC8FF" fill-opacity=".15" stroke="#8CC8FF"/><text class="m" x="566" y="264" font-size="11" fill="#8CC8FF" text-anchor="middle">2</text><rect x="586" y="248" width="101" height="4" rx="2" fill="#B8C2D4" opacity=".55"/><rect x="586" y="260" width="92" height="4" rx="2" fill="#566075"/><rect x="586" y="270" width="70" height="4" rx="2" fill="#566075"/><rect x="546" y="296" width="168" height="52" rx="6" fill="#0B0F16" stroke="#2A3345"/><circle cx="566" cy="322" r="10" fill="#8CC8FF" fill-opacity=".15" stroke="#8CC8FF"/><text class="m" x="566" y="326" font-size="11" fill="#8CC8FF" text-anchor="middle">3</text><rect x="586" y="310" width="92" height="4" rx="2" fill="#B8C2D4" opacity=".55"/><rect x="586" y="322" width="98" height="4" rx="2" fill="#566075"/><rect x="586" y="332" width="80" height="4" rx="2" fill="#566075"/><rect x="546" y="358" width="168" height="52" rx="6" fill="#0B0F16" stroke="#2A3345"/><circle cx="566" cy="384" r="10" fill="#8CC8FF" fill-opacity=".15" stroke="#8CC8FF"/><text class="m" x="566" y="388" font-size="11" fill="#8CC8FF" text-anchor="middle">4</text><rect x="586" y="372" width="83" height="4" rx="2" fill="#B8C2D4" opacity=".55"/><rect x="586" y="384" width="104" height="4" rx="2" fill="#566075"/><rect x="586" y="394" width="90" height="4" rx="2" fill="#566075"/><rect x="750" y="144" width="210" height="290" rx="10" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="766" y="168" font-size="11" fill="#8CC8FF">04 · CITED ANSWER</text><rect x="766" y="182" width="158" height="5" rx="2.5" fill="#B8C2D4" opacity=".6"/><rect x="766" y="202" width="144" height="5" rx="2.5" fill="#B8C2D4" opacity=".6"/><rect x="766" y="222" width="155" height="5" rx="2.5" fill="#B8C2D4" opacity=".6"/><rect x="766" y="242" width="108" height="5" rx="2.5" fill="#B8C2D4" opacity=".6"/><rect x="766" y="262" width="151" height="5" rx="2.5" fill="#B8C2D4" opacity=".6"/><rect x="766" y="282" width="135" height="5" rx="2.5" fill="#B8C2D4" opacity=".6"/><rect x="766" y="302" width="81" height="5" rx="2.5" fill="#B8C2D4" opacity=".6"/><g class="ci" style="animation-delay:0.0s;transform-origin:886px 196px;transform-box:view-box"><rect x="875" y="185" width="22" height="20" rx="5" fill="#8CC8FF" fill-opacity=".18" stroke="#8CC8FF"/><text class="m" x="886" y="200" font-size="11" fill="#8CC8FF" text-anchor="middle">1</text></g><g class="ci" style="animation-delay:0.9s;transform-origin:846px 238px;transform-box:view-box"><rect x="835" y="227" width="22" height="20" rx="5" fill="#8CC8FF" fill-opacity=".18" stroke="#8CC8FF"/><text class="m" x="846" y="242" font-size="11" fill="#8CC8FF" text-anchor="middle">2</text></g><g class="ci" style="animation-delay:1.8s;transform-origin:880px 296px;transform-box:view-box"><rect x="869" y="285" width="22" height="20" rx="5" fill="#8CC8FF" fill-opacity=".18" stroke="#8CC8FF"/><text class="m" x="880" y="300" font-size="11" fill="#8CC8FF" text-anchor="middle">3</text></g><text class="m" x="766" y="372" font-size="10.5" fill="#8E99AD">numbered citations</text><text class="m" x="766" y="388" font-size="10.5" fill="#566075">link back to sources</text><path class="flow" d="M230 290H250" stroke="#8CC8FF" stroke-width="1.6"/><path class="flow" d="M510 290H530" stroke="#8CC8FF" stroke-width="1.6"/><path class="flow" d="M730 290H750" stroke="#8CC8FF" stroke-width="1.6"/><circle r="3.2" fill="#DCEEFF" opacity="0"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M230 290H750"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="6s" begin="0s" repeatCount="indefinite"/></circle><text class="m k" x="40" y="466" font-size="10.5" fill="#566075">ACCOUNT SESSIONS</text><rect x="40" y="476" width="205" height="26" rx="13" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".7"/><circle cx="54" cy="489" r="3.5" fill="#5FD4C8"/><text class="m" x="66" y="493.5" font-size="12" fill="#EAF0F8">Argon2 password hashing</text><rect x="253" y="476" width="213" height="26" rx="13" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".7"/><circle cx="267" cy="489" r="3.5" fill="#5FD4C8"/><text class="m" x="279" y="493.5" font-size="12" fill="#EAF0F8">HttpOnly session cookies</text><rect x="474" y="476" width="162" height="26" rx="13" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".7"/><circle cx="488" cy="489" r="3.5" fill="#5FD4C8"/><text class="m" x="500" y="493.5" font-size="12" fill="#EAF0F8">CSRF header check</text><rect x="644" y="476" width="176" height="26" rx="13" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".7"/><circle cx="658" cy="489" r="3.5" fill="#5FD4C8"/><text class="m" x="670" y="493.5" font-size="12" fill="#EAF0F8">per-user daily caps</text>

