<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="ak-t ak-d">
<title id="ak-t">AkashaLens</title>
<desc id="ak-d">AkashaLens: an animated satellite tile grid. Clouds drift across a block of tiles, then a sweep reveals a reconstruction drawn with a dashed teal outline and hatching, with amber marking low-confidence regions. Beside it, the pipeline: Sentinel-2 imagery, a rule-based cloud mask, a U-Net, and a reconstruction with a confidence heatmap. A prototype trained on a tiny sample set.</desc>
<defs>
<pattern id="ak-g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#131923" stroke-width="1"/></pattern>
<radialGradient id="ak-glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#8CC8FF" stop-opacity=".16"/><stop offset="1" stop-color="#8CC8FF" stop-opacity="0"/></radialGradient>
<linearGradient id="ak-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CC8FF" stop-opacity="0"/><stop offset=".85" stop-color="#8CC8FF" stop-opacity=".14"/><stop offset="1" stop-color="#8CC8FF" stop-opacity=".5"/></linearGradient>
<clipPath id="ak-clip"><rect width="1000" height="520" rx="18"/></clipPath>

<filter id="ak-bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
<pattern id="ak-ht" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#5FD4C8" stroke-opacity=".5" stroke-width="1"/></pattern>

</defs>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.k{letter-spacing:.14em}
.flow{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.scan{animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(640px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.cl{animation:cl 16s ease-in-out infinite}
@keyframes cl{0%,28%{opacity:1}40%,78%{opacity:0}90%,100%{opacity:1}}
.rc{animation:rc 16s ease-in-out infinite}
@keyframes rc{0%,28%{opacity:0}40%,78%{opacity:1}90%,100%{opacity:0}}
.sw{animation:sw 16s linear infinite}
@keyframes sw{0%,28%{transform:translateX(0);opacity:0}30%{opacity:1}40%{transform:translateX(256px);opacity:1}42%,100%{transform:translateX(256px);opacity:0}}
.dr{animation:dr 14s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-22px)}to{transform:translateX(26px)}}
.lb1{animation:cl 16s ease-in-out infinite}
.lb2{animation:rc 16s ease-in-out infinite}
</style>
