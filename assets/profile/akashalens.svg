t><text class="m" x="716" y="193" font-size="10.5" fill="#8E99AD">Copernicus download, sorted by cloud cover</text><path class="flow" d="M818.0 206V230" stroke="#5FD4C8" stroke-width="1.5"/><rect x="676" y="230" width="284" height="56" rx="8" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="690" y="250" font-size="9.5" fill="#566075">02</text><text x="716" y="254" font-size="16" font-weight="600" fill="#EAF0F8">Cloud mask</text><text class="m" x="716" y="273" font-size="10.5" fill="#8E99AD">rule-based: luminance + colour saturation</text><path class="flow" d="M818.0 286V310" stroke="#5FD4C8" stroke-width="1.5"/><rect x="676" y="310" width="284" height="56" rx="8" fill="#0E121A" stroke="#5FD4C8"/><text class="m k" x="690" y="330" font-size="9.5" fill="#566075">03</text><text x="716" y="334" font-size="16" font-weight="600" fill="#EAF0F8">U-Net</text><text class="m" x="716" y="353" font-size="10.5" fill="#8E99AD">3 down stages · L1 loss · Adam</text><path class="flow" d="M818.0 366V390" stroke="#5FD4C8" stroke-width="1.5"/><rect x="676" y="390" width="284" height="56" rx="8" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="690" y="410" font-size="9.5" fill="#566075">04</text><text x="716" y="414" font-size="16" font-weight="600" fill="#EAF0F8">Reconstruction + confidence</text><text class="m" x="716" y="433" font-size="10.5" fill="#8E99AD">heatmap derived from the mask</text><circle r="3.2" fill="#C9FFF8" opacity="0"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M818.0 206V374"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="5s" begin="0s" repeatCount="indefinite"/></circle>

