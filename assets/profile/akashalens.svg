.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.cloud{opacity:.5;animation:cloud 8s ease-in-out infinite}
@keyframes cloud{0%,25%{opacity:.92}50%,72%{opacity:0}95%,100%{opacity:.92}}
  </style>
