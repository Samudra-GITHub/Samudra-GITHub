<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="ob-t ob-d">
<title id="ob-t">Orbit OS</title>
<desc id="ob-d">Orbit OS: floating glass panels for a dashboard, weather and a focus timer drift gently, a command palette types the word weather, and small satellites orbit a core. An interface experiment on mock data, not a real operating system.</desc>
<defs>
<pattern id="ob-g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#131923" stroke-width="1"/></pattern>
<radialGradient id="ob-glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#A99BFF" stop-opacity=".16"/><stop offset="1" stop-color="#A99BFF" stop-opacity="0"/></radialGradient>
<linearGradient id="ob-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A99BFF" stop-opacity="0"/><stop offset=".85" stop-color="#A99BFF" stop-opacity=".14"/><stop offset="1" stop-color="#A99BFF" stop-opacity=".5"/></linearGradient>
<clipPath id="ob-clip"><rect width="1000" height="480" rx="18"/></clipPath>

<linearGradient id="ob-gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/></linearGradient>
<radialGradient id="ob-co" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#A99BFF"/><stop offset="1" stop-color="#A99BFF" stop-opacity="0"/></radialGradient>
<clipPath id="ob-ty"><rect x="318" y="370" width="0" height="20"><animate attributeName="width" values="0;0;74;74;74;0" keyTimes="0;.08;.4;.8;.95;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>

</defs>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.k{letter-spacing:.14em}
.flow{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.scan{animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(640px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.fl{animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.ar{stroke-dasharray:90;animation:ar 6s ease-in-out infinite alternate}
@keyframes ar{from{stroke-dashoffset:60}to{stroke-dashoffset:18}}
.hl{animation:hl 8s ease-in-out infinite}
@keyframes hl{0%,40%{fill-opacity:.18}55%,90%{fill-opacity:.0}100%{fill-opacity:.18}}
</style>
<g clip-path="url(#ob-clip)">
<rect width="1000" height="480" fill="#090B10"/>
<rect width="1000" height="480" fill="url(#ob-g)"/>
<rect width="1000" height="480" fill="url(#ob-glow)"/>
<text x="40" y="94" font-size="38" font-weight="700" fill="#EAF0F8">Orbit OS</text><text class="m" x="42" y="120" font-size="13" fill="#8E99AD">an interface exploration · borrows from operating-system design</text><rect x="676" y="72" width="284" height="30" rx="15" fill="#0E121A" stroke="#A99BFF" stroke-opacity=".7"/><text class="m k" x="818" y="91" font-size="11" fill="#A99BFF" text-anchor="middle">MOCK DATA · NOT A REAL OS</text><g class="fl" style="animation-delay:0s;animation-duration:5s"><rect x="130" y="150" width="360" height="190" rx="12" fill="url(#ob-gl)" stroke="#FFFFFF" stroke-opacity=".16"/><text class="m k" x="144" y="172" font-size="10" fill="#8E99AD">DASHBOARD</text><rect x="150" y="182" width="190" height="14" rx="4" fill="#B8C2D4" opacity=".5"/><rect x="150" y="204" width="120" height="8" rx="4" fill="#566075"/><rect x="150" y="228" width="92" height="52" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".1"/><rect x="254" y="228" width="92" height="52" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".1"/><rect x="358" y="228" width="92" height="52" rx="8" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".1"/><path d="M150 322 C190 296 220 330 262 306 S340 300 392 288 S440 314 470 296" fill="none" stroke="#A99BFF" stroke-width="2"/></g><g class="fl" style="animation-delay:1s;animation-duration:6s"><rect x="510" y="150" width="170" height="84" rx="12" fill="url(#ob-gl)" stroke="#FFFFFF" stroke-opacity=".16"/><text class="m k" x="524" y="172" font-size="10" fill="#8E99AD">WEATHER</text><circle cx="544" cy="204" r="12" fill="#F0B55E" fill-opacity=".8"/><rect x="568" y="196" width="80" height="6" rx="3" fill="#B8C2D4" opacity=".5"/><rect x="568" y="210" width="54" height="6" rx="3" fill="#566075"/></g><g class="fl" style="animation-delay:2s;animation-duration:7s"><rect x="510" y="250" width="170" height="90" rx="12" fill="url(#ob-gl)" stroke="#FFFFFF" stroke-opacity=".16"/><text class="m k" x="524" y="272" font-size="10" fill="#8E99AD">FOCUS TIMER</text><circle cx="560" cy="302" r="18" fill="none" stroke="#2A3345" stroke-width="4"/><circle class="ar" cx="560" cy="302" r="18" fill="none" stroke="#8CC8FF" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="30" transform="rotate(-90 560 302)"/><rect x="592" y="294" width="64" height="6" rx="3" fill="#B8C2D4" opacity=".5"/><rect x="592" y="308" width="40" height="6" rx="3" fill="#566075"/></g><g transform="rotate(-22 830 250)"><ellipse cx="830" cy="250" rx="118" ry="44" fill="none" stroke="#2A3345"/><ellipse cx="830" cy="250" rx="82" ry="30" fill="none" stroke="#2A3345" stroke-dasharray="3 6"/><circle cx="830" cy="250" r="30" fill="url(#ob-co)" opacity=".7"/><circle cx="830" cy="250" r="9" fill="#EAF0F8"/><circle r="6" fill="#5FD4C8"><animateMotion dur="12s" repeatCount="indefinite" path="M948 250 A118 44 0 1 1 712 250 A118 44 0 1 1 948 250"/></circle><circle r="4" fill="#A99BFF"><animateMotion dur="7s" repeatCount="indefinite" path="M748 250 A82 30 0 1 0 912 250 A82 30 0 1 0 748 250"/></circle></g><text class="m" x="830" y="348" font-size="11" fill="#566075" text-anchor="middle">orbit · satellites · modules</text><g><rect x="250" y="360" width="430" height="92" rx="14" fill="#0D1119" stroke="#A99BFF" stroke-opacity=".7"/><circle cx="276" cy="380" r="6" fill="none" stroke="#8E99AD" stroke-width="1.6"/><path d="M280.5 384.5l5 5" stroke="#8E99AD" stroke-width="1.6"/><text class="m" x="318" y="385" font-size="14" fill="#EAF0F8" clip-path="url(#ob-ty)">weather</text><rect class="blink" x="396" y="372" width="2" height="16" fill="#A99BFF"/><text class="m k" x="660" y="385" font-size="9.5" fill="#566075" text-anchor="end">COMMAND PALETTE</text><path d="M262 398H668" stroke="#1D2431"/><rect class="hl" x="258" y="404" width="414" height="20" rx="5" fill="#A99BFF"/><text class="m" x="272" y="418" font-size="12" fill="#EAF0F8">Weather · open forecast</text><text class="m" x="272" y="440" font-size="12" fill="#8E99AD">Focus · start timer</text></g>

<rect width="1000" height="44" fill="#0C1017"/>
<path d="M0 44.5H1000" stroke="#1D2431"/>
<rect x="28" y="19" width="6" height="6" fill="#A99BFF"/>
<text class="m k" x="44" y="26" font-size="11.5" fill="#8E99AD">ORBIT·OS  //  INTERFACE EXPERIMENT</text>
<text class="m k" x="972" y="26" font-size="11.5" fill="#566075" text-anchor="end">NEXT.JS · FRAMER MOTION</text>
<text class="m" x="28" y="464" font-size="11" fill="#566075">Interface exploration. Mock data throughout. Not an operating system.</text>
<path d="M14 450V466H30M986 450V466H970" fill="none" stroke="#A99BFF" stroke-opacity=".55"/>
<rect class="scan" x="0" y="0" width="1000" height="70" fill="url(#ob-scan)" opacity=".5"/>

</g>
<rect x=".5" y=".5" width="999" height="479" rx="18" fill="none" stroke="#2A3345"/>
</svg>
