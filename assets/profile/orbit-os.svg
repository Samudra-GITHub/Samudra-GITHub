<title id="ob-t">Orbit OS</title>
<desc id="ob-d">Orbit OS: floating tilted panels for a dashboard, weather and a focus timer, geometric orbits with glossy spheres, and a command palette typing the word weather. An interface experiment on mock data, not a real operating system.</desc>
