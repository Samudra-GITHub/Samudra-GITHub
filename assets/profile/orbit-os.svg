<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120" role="img" aria-labelledby="t d">
  <title id="t">Orbit OS</title>
  <desc id="d">Animation of a command palette typing weather and listing results, beside a small orbiting dot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101524"/><stop offset="1" stop-color="#080A12"/></linearGradient>
  </defs>
  <style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.cover{transform-box:fill-box;transform-origin:100% 50%;animation:type 8s steps(7,end) infinite}
@keyframes type{0%,5%{transform:scaleX(1)}30%,86%{transform:scaleX(0)}92%,100%{transform:scaleX(1)}}
.caret{animation:caret 8s steps(1) infinite}
@keyframes caret{0%,5%{transform:translateX(0);opacity:1}30%{transform:translateX(52px);opacity:1}34%,100%{opacity:0}}
.r1,.r2,.r3{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-out}
.r1{animation-name:kr1}.r2{animation-name:kr2}.r3{animation-name:kr3}
@keyframes kr1{0%,32%{opacity:0}38%,86%{opacity:1}92%,100%{opacity:0}}
@keyframes kr2{0%,38%{opacity:0}44%,86%{opacity:1}92%,100%{opacity:0}}
@keyframes kr3{0%,44%{opacity:0}50%,86%{opacity:1}92%,100%{opacity:0}}
.orb{transform-origin:700px 60px;animation:orb 7s linear infinite}
@keyframes orb{to{transform:rotate(360deg)}}
  </style>
  <rect x="0.5" y="0.5" width="799" height="119" rx="12" fill="url(#bg)" stroke="#232B3B"/>
  <rect x="28" y="30" width="22" height="2" fill="#5FD4C8"/>
  <text x="28" y="56" font-size="22" font-weight="600" fill="#EEF3FA">Orbit OS</text>
  <text x="28" y="78" font-size="12.5" fill="#8792A6">Dashboard styled like an operating system</text>
  <rect x="352" y="14" width="270" height="30" rx="8" fill="#0B0E18" stroke="#343E52"/>
  <circle cx="368" cy="29" r="4.5" fill="none" stroke="#8792A6" stroke-width="1.5"/><line x1="371.5" y1="32.5" x2="375" y2="36" stroke="#8792A6" stroke-width="1.5" stroke-linecap="round"/>
  <text x="386" y="33.5" font-size="12" fill="#DCE4F0">weather</text>
  <rect class="cover" x="384" y="20" width="60" height="18" fill="#0B0E18"/>
  <rect class="caret" x="386" y="21" width="1.5" height="16" fill="#9CF0E6"/>
  <g class="r1"><rect x="352" y="52" width="270" height="16" rx="5" fill="#5FD4C8" fill-opacity="0.16"/><text x="364" y="64" font-size="11" fill="#EEF3FA">Weather</text></g>
  <g class="r2"><text x="364" y="82" font-size="11" fill="#8792A6">Notes</text></g>
  <g class="r3"><text x="364" y="98" font-size="11" fill="#8792A6">Files</text></g>
  <circle cx="700" cy="60" r="30" fill="none" stroke="#343E52" stroke-dasharray="2 5"/>
  <circle cx="700" cy="60" r="5" fill="#3FBFB4"/>
  <g class="orb"><circle cx="730" cy="60" r="4" fill="#9CF0E6"/></g>
</svg>
