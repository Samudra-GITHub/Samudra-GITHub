<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="cp-t cp-d">
<title id="cp-t">Technical capabilities</title>
<desc id="cp-d">Technical index. Languages: TypeScript, JavaScript, Python, C, x86-64 Assembly. Systems: Clang, LLD, NASM, QEMU, Git, Docker. Web: React, Next.js, Tailwind, Framer Motion, GSAP, Three.js. AI and vision: PyTorch, NumPy, SciPy, scikit-image, LLM APIs. Design: Figma, Design Systems, Motion Design.</desc>
<defs>
<pattern id="cp-g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#131923" stroke-width="1"/></pattern>
<radialGradient id="cp-glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#5FD4C8" stop-opacity=".16"/><stop offset="1" stop-color="#5FD4C8" stop-opacity="0"/></radialGradient>
<linearGradient id="cp-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FD4C8" stop-opacity="0"/><stop offset=".85" stop-color="#5FD4C8" stop-opacity=".14"/><stop offset="1" stop-color="#5FD4C8" stop-opacity=".5"/></linearGradient>
<clipPath id="cp-clip"><rect width="1000" height="410" rx="18"/></clipPath>

</defs>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.k{letter-spacing:.14em}
.flow{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.scan{animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(640px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.rw{animation:rw 10s ease-in-out infinite both}
@keyframes rw{0%,100%{opacity:.7}8%,18%{opacity:1}28%{opacity:.7}}
</style>
