<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
  <title id="t">Samudra Kar. Systems, AI and product.</title>
  <desc id="d">Computer science engineering student in Bangalore, India. Building across layers, from kernels and computer vision to interfaces people enjoy using. An animated strip shows a signal travelling across six layers: product, interface, AI, systems, kernel, hardware.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101524"/>
      <stop offset="1" stop-color="#080A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="820" cy="330" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FBFB4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3FBFB4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .serif{font-family:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
    .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .pulse{animation:travel 6s linear infinite}
    .lit{opacity:0;animation:lit 6s linear infinite}
    @keyframes travel{
      0%{transform:translateX(0);opacity:0}
      5%{opacity:1}
      83%{transform:translateX(792px);opacity:1}
      90%,100%{transform:translateX(792px);opacity:0}
    }
    @keyframes lit{0%{opacity:0}7%{opacity:1}20%{opacity:0}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.pulse,.lit{animation:none}.pulse{opacity:0}}
  </style>

  <rect x="0.5" y="0.5" width="999" height="379" rx="18" fill="url(#bg)" stroke="#232B3B"/>
  <rect x="0.5" y="0.5" width="999" height="379" rx="18" fill="url(#glow)"/>

  <!-- identity -->
  <text class="mono" x="56" y="54" font-size="15" letter-spacing="3" fill="#5FD4C8">COMPUTER SCIENCE ENGINEERING STUDENT</text>
  <text class="mono" x="944" y="54" font-size="15" letter-spacing="3" fill="#8792A6" text-anchor="end">BANGALORE · INDIA</text>
  <text class="serif" x="52" y="140" font-size="86" font-weight="500" letter-spacing="0.5" fill="#EEF3FA">SAMUDRA KAR</text>
  <text class="mono" x="56" y="180" font-size="17" letter-spacing="5" fill="#DCE4F0">SYSTEMS / AI / PRODUCT</text>
  <text class="serif" x="56" y="222" font-size="26" font-style="italic" fill="#B8C2D4">Building across layers — from kernels and computer vision</text>
  <text class="serif" x="56" y="254" font-size="26" font-style="italic" fill="#B8C2D4">to interfaces people enjoy using.</text>

  <!-- layer strip -->
  <line x1="56" y1="290" x2="944" y2="290" stroke="#232B3B"/>
  <line x1="104" y1="314" x2="896" y2="314" stroke="#232B3B" stroke-width="1.5"/>
  <g class="mono" text-anchor="middle">
    <g><circle cx="104" cy="314" r="7" fill="#0B0E18" stroke="#566176" stroke-width="1.5"/><circle class="lit" style="animation-delay:-0.48s" cx="104" cy="314" r="7" fill="#9CF0E6"/>
      <text x="104" y="346" font-size="14" letter-spacing="2" fill="#DCE4F0">PRODUCT</text><text x="104" y="364" font-size="12" fill="#8792A6">Tarang · Rinti</text></g>
    <g><circle cx="262" cy="314" r="7" fill="#0B0E18" stroke="#566176" stroke-width="1.5"/><circle class="lit" style="animation-delay:0.52s" cx="262" cy="314" r="7" fill="#9CF0E6"/>
      <text x="262" y="346" font-size="14" letter-spacing="2" fill="#DCE4F0">INTERFACE</text><text x="262" y="364" font-size="12" fill="#8792A6">Orbit OS</text></g>
    <g><circle cx="420" cy="314" r="7" fill="#0B0E18" stroke="#566176" stroke-width="1.5"/><circle class="lit" style="animation-delay:1.52s" cx="420" cy="314" r="7" fill="#9CF0E6"/>
      <text x="420" y="346" font-size="14" letter-spacing="2" fill="#DCE4F0">AI</text><text x="420" y="364" font-size="12" fill="#8792A6">AkashaLens</text></g>
    <g><circle cx="578" cy="314" r="7" fill="#0B0E18" stroke="#566176" stroke-width="1.5"/><circle class="lit" style="animation-delay:2.52s" cx="578" cy="314" r="7" fill="#9CF0E6"/>
      <text x="578" y="346" font-size="14" letter-spacing="2" fill="#DCE4F0">SYSTEMS</text><text x="578" y="364" font-size="12" fill="#8792A6">services · APIs</text></g>
    <g><circle cx="736" cy="314" r="7" fill="#0B0E18" stroke="#566176" stroke-width="1.5"/><circle class="lit" style="animation-delay:3.52s" cx="736" cy="314" r="7" fill="#9CF0E6"/>
      <text x="736" y="346" font-size="14" letter-spacing="2" fill="#DCE4F0">KERNEL</text><text x="736" y="364" font-size="12" fill="#8792A6">Samagra OS</text></g>
    <g><circle cx="896" cy="314" r="7" fill="#0B0E18" stroke="#566176" stroke-width="1.5"/><circle class="lit" style="animation-delay:4.52s" cx="896" cy="314" r="7" fill="#9CF0E6"/>
      <text x="896" y="346" font-size="14" letter-spacing="2" fill="#DCE4F0">HARDWARE</text><text x="896" y="364" font-size="12" fill="#8792A6">x86-64 · QEMU</text></g>
  </g>

  <!-- travelling signal -->
  <g class="pulse">
    <circle cx="104" cy="314" r="9" fill="#9CF0E6" filter="url(#soft)"/>
    <circle cx="104" cy="314" r="4" fill="#E6FFFB"/>
  </g>
</svg>
