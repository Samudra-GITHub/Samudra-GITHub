<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-labelledby="t d">
  <title id="t">Building at the edge of software.</title>
  <desc id="d">Building at the edge of software. Systems underneath. Interfaces on top. Bangalore, India.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101524"/>
      <stop offset="1" stop-color="#080A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="500" cy="230" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FBFB4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3FBFB4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .serif{font-family:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
    .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="999" height="209" rx="18" fill="url(#bg)" stroke="#232B3B"/>
  <rect x="0.5" y="0.5" width="999" height="209" rx="18" fill="url(#glow)"/>
  <line x1="56" y1="38" x2="944" y2="38" stroke="#232B3B"/>
  <line x1="56" y1="38" x2="104" y2="38" stroke="#3FBFB4" stroke-width="2"/>
  <text class="serif" x="56" y="98" font-size="44" font-weight="500" letter-spacing="1" fill="#EEF3FA">BUILDING AT THE EDGE OF SOFTWARE.</text>
  <text class="serif" x="56" y="146" font-size="27" font-style="italic" fill="#B8C2D4">Systems underneath. Interfaces on top.</text>
  <text class="mono" x="944" y="178" font-size="13" letter-spacing="4" fill="#8792A6" text-anchor="end">BANGALORE · INDIA</text>
</svg>
