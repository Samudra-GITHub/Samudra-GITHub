<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="cl-t cl-d">
<title id="cl-t">Samudra Kar. Open to internships.</title>
<desc id="cl-d">Closing card. Samudra Kar is open to internships. Bangalore, India. Chanakya University. Portfolio at sam-sportfolio.vercel.app. Email hi.samsstudio@gmail.com.</desc>
<defs>
<pattern id="cl-g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#131923" stroke-width="1"/></pattern>
<radialGradient id="cl-glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#5FD4C8" stop-opacity=".16"/><stop offset="1" stop-color="#5FD4C8" stop-opacity="0"/></radialGradient>
<linearGradient id="cl-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FD4C8" stop-opacity="0"/><stop offset=".85" stop-color="#5FD4C8" stop-opacity=".14"/><stop offset="1" stop-color="#5FD4C8" stop-opacity=".5"/></linearGradient>
<clipPath id="cl-clip"><rect width="1000" height="330" rx="18"/></clipPath>

</defs>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.k{letter-spacing:.14em}
.flow{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.scan{animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(640px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
</style>
<g clip-path="url(#cl-clip)">
<rect width="1000" height="330" fill="#090B10"/>
<rect width="1000" height="330" fill="url(#cl-g)"/>
<rect width="1000" height="330" fill="url(#cl-glow)"/>
<circle class="ping" cx="52" cy="104" r="9" fill="none" stroke="#5FD4C8"/><circle cx="52" cy="104" r="5" fill="#5FD4C8"/><text class="m k" x="72" y="109" font-size="12.5" fill="#5FD4C8">AVAILABLE</text><text x="40" y="184" font-size="60" font-weight="700" fill="#EAF0F8" letter-spacing="-2">Open to internships<tspan fill="#5FD4C8">.</tspan></text><text class="m" x="42" y="222" font-size="15" fill="#B8C2D4">systems  ·  AI  ·  product engineering</text><path d="M40 258H250" stroke="#2A3345"/><text class="m k" x="40" y="280" font-size="10" fill="#566075">LOCATION</text><text class="m" x="40" y="300" font-size="13.5" fill="#EAF0F8">Bangalore, India</text><path d="M272 258H482" stroke="#2A3345"/><text class="m k" x="272" y="280" font-size="10" fill="#566075">UNIVERSITY</text><text class="m" x="272" y="300" font-size="13.5" fill="#EAF0F8">Chanakya University</text><path d="M504 258H714" stroke="#2A3345"/><text class="m k" x="504" y="280" font-size="10" fill="#566075">PORTFOLIO</text><text class="m" x="504" y="300" font-size="13.5" fill="#EAF0F8">sam-sportfolio.vercel.app</text><path d="M736 258H946" stroke="#2A3345"/><text class="m k" x="736" y="280" font-size="10" fill="#566075">EMAIL</text><text class="m" x="736" y="300" font-size="13.5" fill="#EAF0F8">hi.samsstudio@gmail.com</text>

<rect width="1000" height="44" fill="#0C1017"/>
<path d="M0 44.5H1000" stroke="#1D2431"/>
<rect x="28" y="19" width="6" height="6" fill="#5FD4C8"/>
<text class="m k" x="44" y="26" font-size="11.5" fill="#8E99AD">END OF PROFILE  //  SAMUDRA·KAR</text>
<text class="m k" x="972" y="26" font-size="11.5" fill="#566075" text-anchor="end">BANGALORE · IN</text>
<text class="m" x="28" y="314" font-size="11" fill="#566075"></text>
<path d="M14 300V316H30M986 300V316H970" fill="none" stroke="#5FD4C8" stroke-opacity=".55"/>
<rect class="scan" x="0" y="0" width="1000" height="70" fill="url(#cl-scan)" opacity=".5"/>

</g>
