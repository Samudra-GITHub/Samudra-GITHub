<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d">
  <title id="t">Building at the edge of software.</title>
  <desc id="d">Building at the edge of software. Systems underneath. Interfaces on top. Bangalore, India.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101524"/>
      <stop offset="1" stop-color="#080A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="500" cy="430" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FBFB4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3FBFB4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .serif{font-family:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
    .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="999" height="419" rx="20" fill="url(#bg)" stroke="#232B3B"/>
  <rect x="0.5" y="0.5" width="999" height="419" rx="20" fill="url(#glow)"/>
  <line x1="64" y1="64" x2="936" y2="64" stroke="#232B3B"/>
  <line x1="64" y1="64" x2="112" y2="64" stroke="#3FBFB4" stroke-width="2"/>
  <text class="serif" x="64" y="158" font-size="62" font-weight="500" letter-spacing="1" fill="#EEF3FA">BUILDING AT THE EDGE</text>
  <text class="serif" x="64" y="224" font-size="62" font-weight="500" letter-spacing="1" fill="#EEF3FA">OF SOFTWARE.</text>
  <text class="serif" x="64" y="282" font-size="30" font-style="italic" fill="#B8C2D4">Systems underneath. Interfaces on top.</text>
  <line x1="64" y1="352" x2="936" y2="352" stroke="#232B3B"/>
  <text class="mono" x="64" y="384" font-size="14" letter-spacing="4" fill="#8792A6">BANGALORE · INDIA</text>
