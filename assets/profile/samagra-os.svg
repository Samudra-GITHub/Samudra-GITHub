<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="so-t so-d">
<title id="so-t">Samagra OS</title>
<desc id="so-d">Samagra OS: an animated kernel observability view. An address-space map, privilege rings with system calls and an IRQ0 timer interrupt, and a round-robin scheduler across kernel tasks and a user process. Boot, memory, interrupts and scheduler are implemented in QEMU; user mode and a RAM-only filesystem are early; kernel heap, networking, persistent storage and a native desktop are planned.</desc>
<defs>
<pattern id="so-g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#131923" stroke-width="1"/></pattern>
<radialGradient id="so-glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#5FD4C8" stop-opacity=".16"/><stop offset="1" stop-color="#5FD4C8" stop-opacity="0"/></radialGradient>
<linearGradient id="so-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FD4C8" stop-opacity="0"/><stop offset=".85" stop-color="#5FD4C8" stop-opacity=".14"/><stop offset="1" stop-color="#5FD4C8" stop-opacity=".5"/></linearGradient>
<clipPath id="so-clip"><rect width="1000" height="560" rx="18"/></clipPath>

</defs>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.k{letter-spacing:.14em}
.flow{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.scan{animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(640px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.cur{animation:cur 6s linear infinite}
@keyframes cur{from{transform:translateY(0)}to{transform:translateY(204px)}}
.sl{animation:sl 6s steps(1) infinite}
@keyframes sl{0%,16.6%{opacity:1}16.7%,100%{opacity:.2}}
.ph{animation:ph 6s linear infinite}
@keyframes ph{from{transform:translateX(0)}to{transform:translateX(180px)}}
.shock{transform-box:fill-box;transform-origin:center;animation:shock 1.8s ease-out infinite}
@keyframes shock{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.cg{animation:cg 9s ease-in-out infinite}
@keyframes cg{0%,12%,100%{stroke-opacity:.45}4%{stroke-opacity:1}}
.tk{animation:tk 3s steps(1) infinite}
@keyframes tk{0%,8%{opacity:1}9%,100%{opacity:.35}}
</style>
<g clip-path="url(#so-clip)">
<rect width="1000" height="560" fill="#090B10"/>
<rect width="1000" height="560" fill="url(#so-g)"/>
<rect width="1000" height="560" fill="url(#so-glow)"/>
<text x="40" y="94" font-size="38" font-weight="700" fill="#EAF0F8">Samagra OS</text><text class="m" x="42" y="120" font-size="13" fill="#8E99AD">a real x86-64 operating system, built from first principles</text><rect x="716" y="72" width="244" height="30" rx="15" fill="#0E121A" stroke="#F0B55E" stroke-opacity=".7"/><circle cx="734" cy="87" r="4" fill="#F0B55E"/><text class="m k" x="748" y="91" font-size="11" fill="#F0B55E">EARLY DEVELOPMENT</text><rect x="40" y="140" width="250" height="268" rx="10" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="56" y="164" font-size="11" fill="#5FD4C8">01 · ADDRESS SPACE</text><rect x="56" y="176" width="218" height="52" rx="5" fill="#0B0F16" stroke-dasharray="4 4" stroke="#F0B55E" stroke-opacity=".7"/><text class="m" x="68" y="201.0" font-size="12" fill="#EAF0F8">USER · per process</text><text class="m" x="68" y="215.0" font-size="10.5" fill="#8E99AD">Ring 3 · early</text><rect x="56" y="232" width="218" height="42" rx="5" fill="#0B0F16" stroke="#2A3345"/><text class="m" x="68" y="252.0" font-size="12" fill="#EAF0F8">KERNEL IMAGE</text><text class="m" x="68" y="266.0" font-size="10.5" fill="#8E99AD">Ring 0 · C + NASM</text><rect x="56" y="278" width="218" height="38" rx="5" fill="#0B0F16" stroke="#2A3345"/><text class="m" x="68" y="296.0" font-size="12" fill="#EAF0F8">PAGE TABLES</text><text class="m" x="68" y="310.0" font-size="10.5" fill="#8E99AD">4-level · map / unmap</text><rect x="56" y="320" width="218" height="38" rx="5" fill="#0B0F16" stroke="#2A3345"/><text class="m" x="68" y="338.0" font-size="12" fill="#EAF0F8">PMM BITMAP</text><text class="m" x="68" y="352.0" font-size="10.5" fill="#8E99AD">physical page allocator</text><rect x="56" y="362" width="218" height="34" rx="5" fill="#0B0F16" stroke="#2A3345"/><text class="m" x="68" y="378.0" font-size="12" fill="#EAF0F8">VGA TEXT BUFFER</text><text class="m" x="68" y="392.0" font-size="10.5" fill="#8E99AD">0xB8000</text><g class="cur"><rect x="52" y="172" width="226" height="2" fill="#5FD4C8"/><rect x="52" y="172" width="226" height="14" fill="#5FD4C8" opacity=".10"/></g><rect x="310" y="140" width="340" height="268" rx="10" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="326" y="164" font-size="11" fill="#8CC8FF">02 · PRIVILEGE RINGS</text><circle cx="482" cy="290" r="100" fill="none" stroke="#F0B55E" stroke-opacity=".75" stroke-dasharray="5 5"/><circle cx="482" cy="290" r="58" fill="#5FD4C8" fill-opacity=".07" stroke="#5FD4C8"/><text class="m k" x="482" y="214" font-size="11" fill="#F0B55E" text-anchor="middle">RING 3 · USER (EARLY)</text><text class="m k" x="482" y="288" font-size="12" fill="#5FD4C8" text-anchor="middle">RING 0</text><text class="m" x="482" y="306" font-size="11" fill="#8E99AD" text-anchor="middle">kernel</text><path class="flow" d="M422 228 C430 248 444 258 458 264" fill="none" stroke="#8CC8FF" stroke-width="1.5"/><path class="flow" d="M506 264 C522 258 536 246 544 226" fill="none" stroke="#8CC8FF" stroke-width="1.5" style="animation-direction:reverse"/><circle r="3.2" fill="#8CC8FF" opacity="0"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M422 228 C430 248 444 258 458 264"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle><circle r="3.2" fill="#8CC8FF" opacity="0"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M506 264 C522 258 536 246 544 226"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle><text class="m" x="552" y="246" font-size="11" fill="#8CC8FF">12 syscalls</text><circle class="shock" cx="332" cy="310" r="16" fill="none" stroke="#5FD4C8"/><circle cx="332" cy="310" r="5" fill="#5FD4C8"/><text class="m k" x="322" y="338" font-size="11" fill="#5FD4C8">IRQ0</text><path class="flow" d="M338 310 L424 294" stroke="#5FD4C8" stroke-width="1.5" fill="none"/><circle r="3.2" fill="#C9FFF8" opacity="0"><animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" path="M338 310 L424 294"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="1.8s" begin="0s" repeatCount="indefinite"/></circle><text class="m" x="482" y="410" font-size="10.5" fill="#566075" text-anchor="middle">PIC 0x20 / 0x28 · PIT 100 Hz</text><rect x="670" y="140" width="290" height="268" rx="10" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="686" y="164" font-size="11" fill="#5FD4C8">03 · SCHEDULER</text><path class="tk" style="animation-delay:-0.0s" d="M756 178v10" stroke="#566075"/><path class="tk" style="animation-delay:-0.0s" d="M786 178v10" stroke="#566075"/><path class="tk" style="animation-delay:-0.0s" d="M816 178v10" stroke="#566075"/><path class="tk" style="animation-delay:-0.0s" d="M846 178v10" stroke="#566075"/><path class="tk" style="animation-delay:-0.0s" d="M876 178v10" stroke="#566075"/><path class="tk" style="animation-delay:-0.0s" d="M906 178v10" stroke="#566075"/><path class="tk" style="animation-delay:0.0s" d="M936 178v10" stroke="#566075"/><text class="m" x="690" y="188" font-size="10.5" fill="#566075">IRQ0</text><text class="m" x="690" y="230" font-size="11" fill="#8E99AD">kernel A</text><rect x="756" y="208" width="180" height="32" rx="4" fill="#0B0F16" stroke="#1D2431"/><rect class="sl" style="animation-delay:-6s" x="758" y="211" width="26" height="26" rx="3" fill="#5FD4C8"/><rect class="sl" style="animation-delay:-3s" x="848" y="211" width="26" height="26" rx="3" fill="#5FD4C8"/><text class="m" x="690" y="282" font-size="11" fill="#8E99AD">kernel B</text><rect x="756" y="260" width="180" height="32" rx="4" fill="#0B0F16" stroke="#1D2431"/><rect class="sl" style="animation-delay:-5s" x="788" y="263" width="26" height="26" rx="3" fill="#5FD4C8"/><rect class="sl" style="animation-delay:-2s" x="878" y="263" width="26" height="26" rx="3" fill="#5FD4C8"/><text class="m" x="690" y="334" font-size="11" fill="#8E99AD">user</text><rect x="756" y="312" width="180" height="32" rx="4" fill="#0B0F16" stroke="#1D2431"/><rect class="sl" style="animation-delay:-4s" x="818" y="315" width="26" height="26" rx="3" fill="#F0B55E"/><rect class="sl" style="animation-delay:-1s" x="908" y="315" width="26" height="26" rx="3" fill="#F0B55E"/><g class="ph"><rect x="756" y="198" width="1.5" height="156" fill="#EAF0F8" opacity=".7"/></g><text class="m" x="690" y="386" font-size="11.5" fill="#B8C2D4">preemptive round-robin</text><text class="m" x="690" y="402" font-size="10.5" fill="#566075">kernel tasks + user processes</text><text class="m k" x="40" y="434" font-size="10.5" fill="#566075">IMPLEMENTED AND OBSERVED IN QEMU</text><rect class="cg" style="animation-delay:0.0s" x="40" y="444" width="140" height="26" rx="13" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".7"/><circle cx="54" cy="457" r="3.5" fill="#5FD4C8"/><text class="m" x="66" y="461.5" font-size="12" fill="#EAF0F8">long-mode boot</text><rect class="cg" style="animation-delay:0.5s" x="188" y="444" width="59" height="26" rx="13" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".7"/><circle cx="202" cy="457" r="3.5" fill="#5FD4C8"/><text class="m" x="214" y="461.5" font-size="12" fill="#EAF0F8">PMM</text><rect class="cg" style="animation-delay:1.0s" x="255" y="444" width="59" height="26" rx="13" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".7"/><circle cx="269" cy="457" r="3.5" fill="#5FD4C8"/><text class="m" x="281" y="461.5" font-size="12" fill="#EAF0F8">VMM</text><rect class="cg" style="animation-delay:1.5s" x="322" y="444" width="154" height="26" rx="13" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".7"/><circle cx="336" cy="457" r="3.5" fill="#5FD4C8"/><text class="m" x="348" y="461.5" font-size="12" fill="#EAF0F8">IDT + exceptions</text><rect class="cg" style="animation-delay:2.0s" x="484" y="444" width="103" height="26" rx="13" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".7"/><circle cx="498" cy="457" r="3.5" fill="#5FD4C8"/><text class="m" x="510" y="461.5" font-size="12" fill="#EAF0F8">PIC + PIT</text><rect class="cg" style="animation-delay:2.5s" x="595" y="444" width="103" height="26" rx="13" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".7"/><circle cx="609" cy="457" r="3.5" fill="#5FD4C8"/><text class="m" x="621" y="461.5" font-size="12" fill="#EAF0F8">scheduler</text><rect class="cg" style="animation-delay:3.0s" x="706" y="444" width="103" height="26" rx="13" fill="#0E121A" stroke="#F0B55E" stroke-opacity=".7"/><circle cx="720" cy="457" r="3.5" fill="none" stroke="#F0B55E" stroke-width="1.5"/><path d="M720 453.5a3.5 3.5 0 0 0 0 7z" fill="#F0B55E"/><text class="m" x="732" y="461.5" font-size="12" fill="#EAF0F8">user mode</text><rect class="cg" style="animation-delay:3.5s" x="817" y="444" width="140" height="26" rx="13" fill="#0E121A" stroke="#F0B55E" stroke-opacity=".7"/><circle cx="831" cy="457" r="3.5" fill="none" stroke="#F0B55E" stroke-width="1.5"/><path d="M831 453.5a3.5 3.5 0 0 0 0 7z" fill="#F0B55E"/><text class="m" x="843" y="461.5" font-size="12" fill="#EAF0F8">RAM filesystem</text><text class="m k" x="40" y="494" font-size="10.5" fill="#566075">PLANNED, NOT IMPLEMENTED</text><rect x="40" y="504" width="118" height="26" rx="13" fill="#0E121A" stroke="#2A3345" stroke-opacity="1" stroke-dasharray="3 4"/><circle cx="54" cy="517" r="3.5" fill="none" stroke="#566075" stroke-width="1.5"/><text class="m" x="66" y="521.5" font-size="12" fill="#8E99AD">kernel heap</text><rect x="166" y="504" width="111" height="26" rx="13" fill="#0E121A" stroke="#2A3345" stroke-opacity="1" stroke-dasharray="3 4"/><circle cx="180" cy="517" r="3.5" fill="none" stroke="#566075" stroke-width="1.5"/><text class="m" x="192" y="521.5" font-size="12" fill="#8E99AD">networking</text><rect x="285" y="504" width="169" height="26" rx="13" fill="#0E121A" stroke="#2A3345" stroke-opacity="1" stroke-dasharray="3 4"/><circle cx="299" cy="517" r="3.5" fill="none" stroke="#566075" stroke-width="1.5"/><text class="m" x="311" y="521.5" font-size="12" fill="#8E99AD">persistent storage</text><rect x="462" y="504" width="140" height="26" rx="13" fill="#0E121A" stroke="#2A3345" stroke-opacity="1" stroke-dasharray="3 4"/><circle cx="476" cy="517" r="3.5" fill="none" stroke="#566075" stroke-width="1.5"/><text class="m" x="488" y="521.5" font-size="12" fill="#8E99AD">native desktop</text><rect x="610" y="504" width="169" height="26" rx="13" fill="#0E121A" stroke="#2A3345" stroke-opacity="1" stroke-dasharray="3 4"/><circle cx="624" cy="517" r="3.5" fill="none" stroke="#566075" stroke-width="1.5"/><text class="m" x="636" y="521.5" font-size="12" fill="#8E99AD">security hardening</text>

