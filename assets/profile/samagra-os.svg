<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120" role="img" aria-labelledby="t d">
  <title id="t">Samagra OS</title>
  <desc id="d">Animated terminal lines: memory, interrupts and scheduler ok, user mode early. Stylised from the real init sequence, not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101524"/><stop offset="1" stop-color="#080A12"/></linearGradient>
  </defs>
  <style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.ln{animation:ln 10s ease-out infinite both}
@keyframes ln{0%{opacity:0}4%{opacity:1}90%{opacity:1}96%,100%{opacity:0}}
.cur{animation:cur 1.1s steps(1) infinite}
@keyframes cur{0%,55%{opacity:1}56%,100%{opacity:0}}
  </style>
  <rect x="0.5" y="0.5" width="799" height="119" rx="12" fill="url(#bg)" stroke="#232B3B"/>
  <rect x="28" y="30" width="22" height="2" fill="#5FD4C8"/>
  <text x="28" y="56" font-size="22" font-weight="600" fill="#EEF3FA">Samagra OS</text>
  <text x="28" y="78" font-size="12.5" fill="#8792A6">x86-64 operating system, in QEMU</text>
  <rect x="340" y="14" width="432" height="92" rx="8" fill="#0B0E18" stroke="#232B3B"/>
  <g class="ln" style="animation-delay:0.3s">
    <text class="m" x="360" y="38" font-size="12.5" fill="#DCE4F0">memory</text>
    <line x1="450" y1="34" x2="690" y2="34" stroke="#343E52" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 6"/>
    <text class="m" x="708" y="38" font-size="12.5" fill="#5FD4C8">ok</text>
  </g>
  <g class="ln" style="animation-delay:1.1s">
    <text class="m" x="360" y="58" font-size="12.5" fill="#DCE4F0">interrupts</text>
    <line x1="450" y1="54" x2="690" y2="54" stroke="#343E52" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 6"/>
    <text class="m" x="708" y="58" font-size="12.5" fill="#5FD4C8">ok</text>
  </g>
  <g class="ln" style="animation-delay:1.9s">
    <text class="m" x="360" y="78" font-size="12.5" fill="#DCE4F0">scheduler</text>
    <line x1="450" y1="74" x2="690" y2="74" stroke="#343E52" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 6"/>
    <text class="m" x="708" y="78" font-size="12.5" fill="#5FD4C8">ok</text>
  </g>
  <g class="ln" style="animation-delay:2.7s">
    <text class="m" x="360" y="98" font-size="12.5" fill="#DCE4F0">user mode</text>
    <line x1="440" y1="94" x2="690" y2="94" stroke="#343E52" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 6"/>
    <text class="m" x="708" y="98" font-size="12.5" fill="#8792A6">early</text>
  </g>
  <rect class="cur" x="752" y="87" width="7" height="13" fill="#9CF0E6"/>
</svg>
