<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="so-t so-d">
<title id="so-t">Samagra OS</title>
<desc id="so-d">Samagra OS: an illustrated kernel laboratory. A memory map with a user region, kernel image, page tables, physical page bitmap and VGA buffer; privilege rings with system calls crossing between Ring 3 and Ring 0 and a timer interrupt; and a round-robin scheduler across kernel tasks and a user process. Boot, memory, interrupts and scheduling are implemented in QEMU; user mode and a RAM-only filesystem are early; kernel heap, networking, persistent storage, security hardening and a native desktop are planned.</desc>
