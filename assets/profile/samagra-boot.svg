<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
  <title id="t">Samagra OS boot sequence, stylised</title>
  <desc id="d">A stylised terminal showing the kernel initialisation: memory management, interrupts, timer and scheduler are working; keyboard input is basic. The last line reads kernel tasks running, no user space yet, followed by a blinking cursor. This is an illustration based on the real init sequence, not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101524"/>
      <stop offset="1" stop-color="#080A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="500" cy="200" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FBFB4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3FBFB4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .serif{font-family:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
    .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .ln{animation:ln 12s ease-out infinite both}
    @keyframes ln{0%{opacity:0}3%{opacity:1}90%{opacity:1}96%,100%{opacity:0}}
    .cur{animation:cur 1.1s steps(1) infinite}
    @keyframes cur{0%,55%{opacity:1}56%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.ln,.cur{animation:none}}
  </style>

  <rect x="0.5" y="0.5" width="999" height="379" rx="18" fill="url(#bg)" stroke="#232B3B"/>
  <rect x="0.5" y="0.5" width="999" height="379" rx="18" fill="url(#glow)"/>

  <text class="serif" x="56" y="78" font-size="54" font-weight="500" letter-spacing="1.5" fill="#EEF3FA">SAMAGRA OS</text>
  <text class="mono" x="944" y="70" font-size="14" letter-spacing="3" fill="#8792A6" text-anchor="end">x86-64 · LONG MODE</text>
  <line x1="56" y1="98" x2="944" y2="98" stroke="#232B3B"/>
  <line x1="56" y1="98" x2="104" y2="98" stroke="#3FBFB4" stroke-width="2"/>

  <g class="mono" font-size="23" letter-spacing="1">
    <g class="ln" style="animation-delay:0.4s">
      <text x="56" y="140" fill="#DCE4F0">MEMORY <tspan fill="#8792A6" font-size="16">PMM · VMM</tspan></text>
      <line x1="400" y1="134" x2="790" y2="134" stroke="#343E52" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9"/>
      <text x="822" y="140" fill="#5FD4C8">OK</text>
    </g>
    <g class="ln" style="animation-delay:1.3s">
      <text x="56" y="176" fill="#DCE4F0">INTERRUPTS <tspan fill="#8792A6" font-size="16">IDT · PIC</tspan></text>
      <line x1="400" y1="170" x2="790" y2="170" stroke="#343E52" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9"/>
      <text x="822" y="176" fill="#5FD4C8">OK</text>
    </g>
    <g class="ln" style="animation-delay:2.2s">
      <text x="56" y="212" fill="#DCE4F0">TIMER <tspan fill="#8792A6" font-size="16">PIT · 100 Hz</tspan></text>
      <line x1="400" y1="206" x2="790" y2="206" stroke="#343E52" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9"/>
      <text x="822" y="212" fill="#5FD4C8">OK</text>
    </g>
    <g class="ln" style="animation-delay:3.1s">
      <text x="56" y="248" fill="#DCE4F0">SCHEDULER <tspan fill="#8792A6" font-size="16">ROUND-ROBIN</tspan></text>
      <line x1="400" y1="242" x2="790" y2="242" stroke="#343E52" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9"/>
      <text x="822" y="248" fill="#5FD4C8">OK</text>
    </g>
    <g class="ln" style="animation-delay:4s">
      <text x="56" y="284" fill="#DCE4F0">INPUT <tspan fill="#8792A6" font-size="16">PS/2 KEYBOARD</tspan></text>
      <line x1="400" y1="278" x2="790" y2="278" stroke="#343E52" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9"/>
      <text x="822" y="284" fill="#8792A6">BASIC</text>
    </g>
  </g>

  <line x1="56" y1="304" x2="944" y2="304" stroke="#232B3B"/>
  <g class="ln" style="animation-delay:5s">
    <text class="mono" x="56" y="338" font-size="19" letter-spacing="3" fill="#DCE4F0">KERNEL TASKS RUNNING · NO USER SPACE YET</text>
  </g>
  <g class="ln" style="animation-delay:5.8s">
    <text class="mono" x="56" y="364" font-size="19" fill="#5FD4C8">&gt;</text>
    <rect class="cur" x="78" y="349" width="11" height="18" fill="#9CF0E6"/>
  </g>
  <text class="mono" x="944" y="366" font-size="12" letter-spacing="2" fill="#566176" text-anchor="end">STYLISED FROM THE REAL INIT SEQUENCE · NOT A SCREENSHOT</text>
</svg>
