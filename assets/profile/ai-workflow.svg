<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
  <title id="t">Human direction and AI execution</title>
  <desc id="d">A left-to-right workflow diagram. Samudra, a human, provides architecture, product direction and validation. Direction flows to two AI engineering agents: Claude Code, which handles UI, documentation, design and user-facing systems, and Antigravity, which handles kernel, memory, interrupts, scheduling and low-level systems. Both work in one shared repository of git history, docs, agent notes and API contracts. Validation flows back from the repository to Samudra.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101524"/>
      <stop offset="1" stop-color="#080A12"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5FD4C8"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8792A6"/>
    </marker>
  </defs>
  <style>
    .serif{font-family:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
    .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .flow{animation:flow 1.6s linear infinite}
    .back{animation:flow 3.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}
    @media (prefers-reduced-motion:reduce){.flow,.back{animation:none}}
  </style>

  <rect x="0.5" y="0.5" width="999" height="379" rx="18" fill="url(#bg)" stroke="#232B3B"/>

  <!-- connectors -->
  <g fill="none" stroke="#5FD4C8" stroke-width="1.6" stroke-dasharray="6 10" marker-end="url(#ah)">
    <path class="flow" d="M280 160 H322 V100 H365"/>
    <path class="flow" d="M280 160 H322 V220 H365"/>
    <path class="flow" d="M635 100 H678 V160 H722"/>
    <path class="flow" d="M635 220 H678 V160 H722"/>
  </g>
  <path class="back" d="M840 232 V344 H160 V232" fill="none" stroke="#8792A6" stroke-width="1.4" stroke-dasharray="4 12" marker-end="url(#ahg)"/>
  <text class="mono" x="500" y="348" font-size="12" letter-spacing="3" fill="#8792A6" text-anchor="middle" stroke="#0B0E18" stroke-width="8" style="paint-order:stroke">VALIDATION</text>

  <!-- human -->
  <rect x="40" y="96" width="240" height="128" rx="12" fill="#0B0E18" stroke="#566176"/>
  <text class="mono" x="62" y="126" font-size="12" letter-spacing="4" fill="#5FD4C8">HUMAN</text>
  <text class="serif" x="62" y="164" font-size="34" font-weight="500" fill="#EEF3FA">Samudra</text>
  <text class="mono" x="62" y="188" font-size="13" fill="#8792A6">architecture · direction</text>
  <text class="mono" x="62" y="206" font-size="13" fill="#8792A6">· validation</text>

  <!-- agents -->
  <rect x="365" y="40" width="270" height="120" rx="12" fill="#0B0E18" stroke="#232B3B"/>
  <text class="mono" x="387" y="68" font-size="12" letter-spacing="4" fill="#5FD4C8">AI AGENT</text>
  <text class="serif" x="387" y="102" font-size="30" font-weight="500" fill="#EEF3FA">Claude Code</text>
  <text class="mono" x="387" y="128" font-size="13" fill="#8792A6">UI · documentation · design</text>
  <text class="mono" x="387" y="146" font-size="13" fill="#8792A6">user-facing systems</text>

  <rect x="365" y="180" width="270" height="120" rx="12" fill="#0B0E18" stroke="#232B3B"/>
  <text class="mono" x="387" y="208" font-size="12" letter-spacing="4" fill="#5FD4C8">AI AGENT</text>
  <text class="serif" x="387" y="242" font-size="30" font-weight="500" fill="#EEF3FA">Antigravity</text>
  <text class="mono" x="387" y="268" font-size="13" fill="#8792A6">kernel · memory · interrupts</text>
  <text class="mono" x="387" y="286" font-size="13" fill="#8792A6">scheduling · low-level systems</text>

  <!-- repository -->
  <rect x="722" y="96" width="240" height="128" rx="12" fill="#0B0E18" stroke="#566176"/>
  <text class="mono" x="744" y="126" font-size="12" letter-spacing="3" fill="#5FD4C8">ONE REPOSITORY</text>
  <text class="mono" x="744" y="158" font-size="14" fill="#DCE4F0">git history · docs/</text>
  <text class="mono" x="744" y="180" font-size="14" fill="#DCE4F0">.agents/ · API contracts</text>
  <text class="mono" x="744" y="202" font-size="14" fill="#DCE4F0">handoff notes</text>
</svg>
