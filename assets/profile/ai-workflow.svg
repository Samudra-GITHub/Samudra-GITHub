<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="aw-t aw-d">
<title id="aw-t">Engineering with AI</title>
<desc id="aw-d">Workflow diagram. Samudra, a human engineer, sets architecture and direction. Direction flows to two AI engineering agents: Claude Code for UI, UX, design tokens and documentation, and Antigravity for boot, memory, interrupts, scheduler and drivers. Both work in one shared repository through sync logs, handoff notes, architecture docs, API contracts and commits. A validation loop of review, run and accept or reject returns to Samudra.</desc>
<defs>
<pattern id="aw-g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#131923" stroke-width="1"/></pattern>
<radialGradient id="aw-glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#5FD4C8" stop-opacity=".16"/><stop offset="1" stop-color="#5FD4C8" stop-opacity="0"/></radialGradient>
<linearGradient id="aw-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FD4C8" stop-opacity="0"/><stop offset=".85" stop-color="#5FD4C8" stop-opacity=".14"/><stop offset="1" stop-color="#5FD4C8" stop-opacity=".5"/></linearGradient>
<clipPath id="aw-clip"><rect width="1000" height="540" rx="18"/></clipPath>

</defs>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.k{letter-spacing:.14em}
.flow{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.scan{animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(640px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.gt{animation:gt 8s ease-in-out infinite}
@keyframes gt{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}
</style>
<g clip-path="url(#aw-clip)">
<rect width="1000" height="540" fill="#090B10"/>
<rect width="1000" height="540" fill="url(#aw-g)"/>
<rect width="1000" height="540" fill="url(#aw-glow)"/>
<rect x="40" y="150" width="230" height="170" rx="12" fill="#0E121A" stroke="#5FD4C8" stroke-opacity=".8"/><text class="m k" x="58" y="176" font-size="10" fill="#5FD4C8">HUMAN · ENGINEER</text><text x="58" y="204" font-size="23" font-weight="700" fill="#EAF0F8">Samudra</text><text class="m" x="58" y="230" font-size="12.5" fill="#B8C2D4">architecture</text><text class="m" x="58" y="250" font-size="12.5" fill="#B8C2D4">direction</text><text class="m" x="58" y="270" font-size="12.5" fill="#B8C2D4">review + validation</text><rect x="380" y="100" width="260" height="130" rx="12" fill="#0E121A" stroke="#8CC8FF" stroke-opacity=".8"/><text class="m k" x="398" y="126" font-size="10" fill="#8CC8FF">AI ENGINEERING AGENT</text><text x="398" y="154" font-size="23" font-weight="700" fill="#EAF0F8">Claude Code</text><text class="m" x="398" y="180" font-size="12.5" fill="#B8C2D4">UI · UX · desktop design</text><text class="m" x="398" y="200" font-size="12.5" fill="#B8C2D4">design tokens · docs</text><rect x="380" y="260" width="260" height="130" rx="12" fill="#0E121A" stroke="#A99BFF" stroke-opacity=".8"/><text class="m k" x="398" y="286" font-size="10" fill="#A99BFF">AI ENGINEERING AGENT</text><text x="398" y="314" font-size="23" font-weight="700" fill="#EAF0F8">Antigravity</text><text class="m" x="398" y="340" font-size="12.5" fill="#B8C2D4">boot · memory · interrupts</text><text class="m" x="398" y="360" font-size="12.5" fill="#B8C2D4">scheduler · drivers</text><rect x="730" y="90" width="230" height="310" rx="12" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="748" y="116" font-size="10" fill="#8E99AD">ONE SHARED REPOSITORY</text><rect x="746" y="134" width="198" height="54" rx="8" fill="#0B0F16" stroke="#1D2431"/><text class="m" x="760" y="157" font-size="13" fill="#EAF0F8">.agents/</text><text class="m" x="760" y="176" font-size="10.5" fill="#8E99AD">sync log · handoff notes</text><rect x="746" y="200" width="198" height="54" rx="8" fill="#0B0F16" stroke="#1D2431"/><text class="m" x="760" y="223" font-size="13" fill="#EAF0F8">docs/</text><text class="m" x="760" y="242" font-size="10.5" fill="#8E99AD">architecture · design</text><rect x="746" y="266" width="198" height="54" rx="8" fill="#0B0F16" stroke="#1D2431"/><text class="m" x="760" y="289" font-size="13" fill="#EAF0F8">API_CONTRACTS</text><text class="m" x="760" y="308" font-size="10.5" fill="#8E99AD">proposed > agreed > done</text><rect x="746" y="332" width="198" height="54" rx="8" fill="#0B0F16" stroke="#1D2431"/><text class="m" x="760" y="355" font-size="13" fill="#EAF0F8">git history</text><text class="m" x="760" y="374" font-size="10.5" fill="#8E99AD">small, described commits</text><path class="flow" d="M270 215 C320 215 330 165 380 165" fill="none" stroke="#5FD4C8" stroke-width="1.8"/><path class="flow" d="M270 255 C320 255 330 325 380 325" fill="none" stroke="#5FD4C8" stroke-width="1.8"/><path class="flow" d="M640 165 C690 165 690 200 730 200" fill="none" stroke="#5FD4C8" stroke-width="1.8"/><path class="flow" d="M640 325 C690 325 690 300 730 300" fill="none" stroke="#5FD4C8" stroke-width="1.8"/><circle r="3.2" fill="#C9FFF8" opacity="0"><animateMotion dur="3.2s" begin="0.0s" repeatCount="indefinite" path="M270 215 C320 215 330 165 380 165"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.2s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="3.2" fill="#C9FFF8" opacity="0"><animateMotion dur="3.2s" begin="0.4s" repeatCount="indefinite" path="M270 255 C320 255 330 325 380 325"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></circle><circle r="3.2" fill="#C9FFF8" opacity="0"><animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite" path="M640 165 C690 165 690 200 730 200"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle><circle r="3.2" fill="#C9FFF8" opacity="0"><animateMotion dur="3.2s" begin="1.2000000000000002s" repeatCount="indefinite" path="M640 325 C690 325 690 300 730 300"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.2s" begin="1.2000000000000002s" repeatCount="indefinite"/></circle><text class="m k" x="282" y="240" font-size="9.5" fill="#5FD4C8">DIRECTION</text><path d="M845 400 V452 H155 V320" fill="none" stroke="#F0B55E" stroke-width="1.8" stroke-dasharray="6 6" class="gt"/><path d="M149 332l6-12 6 12" fill="none" stroke="#F0B55E" stroke-width="1.8"/><circle r="3.6" fill="#F0B55E" opacity="0"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M845 400 V452 H155 V320"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="6s" begin="0s" repeatCount="indefinite"/></circle><rect x="345" y="436" width="310" height="32" rx="16" fill="#090B10" stroke="#F0B55E" stroke-opacity=".8"/><text class="m k" x="500" y="456" font-size="11" fill="#F0B55E" text-anchor="middle">REVIEW · RUN · ACCEPT OR REJECT</text><text class="m k" x="165" y="388" font-size="9.5" fill="#F0B55E">VALIDATION</text>

<rect width="1000" height="44" fill="#0C1017"/>
<path d="M0 44.5H1000" stroke="#1D2431"/>
<rect x="28" y="19" width="6" height="6" fill="#5FD4C8"/>
<text class="m k" x="44" y="26" font-size="11.5" fill="#8E99AD">HUMAN-LED  //  AI-IMPLEMENTED</text>
<text class="m k" x="972" y="26" font-size="11.5" fill="#566075" text-anchor="end">CLAUDE CODE · ANTIGRAVITY</text>
<text class="m" x="28" y="524" font-size="11" fill="#566075">The agents are tools, not people. Scope, interfaces and trade-offs stay with Samudra.</text>
<path d="M14 510V526H30M986 510V526H970" fill="none" stroke="#5FD4C8" stroke-opacity=".55"/>
<rect class="scan" x="0" y="0" width="1000" height="70" fill="url(#aw-scan)" opacity=".5"/>

</g>
<rect x=".5" y=".5" width="999" height="539" rx="18" fill="none" stroke="#2A3345"/>
</svg>
