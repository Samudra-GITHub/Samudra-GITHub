<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="pr-t pr-d">
<title id="pr-t">PRAHARI</title>
<desc id="pr-d">PRAHARI: mine safety and compliance monitoring. A chain of audit blocks, each hash linked to the previous one, verified in sequence; an explainable risk score between 0 and 1 with its contributing factors and an alert threshold at 0.8; and a copilot flow where questions are parsed deterministically, answered from role-scoped database retrieval inside a permission boundary, and only then narrated by an LLM. Built for the Smart India Hackathon.</desc>
