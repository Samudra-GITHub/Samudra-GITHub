<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 556" width="1000" height="556" role="img" aria-labelledby="pr-t pr-d">
<title id="pr-t">PRAHARI</title>
<desc id="pr-d">PRAHARI: an animated compliance-monitoring view. A chain of audit blocks, each hash linked to the previous one, is verified in sequence. Below, an explainable risk score between 0 and 1 with its contributing factors, and a copilot flow where questions are parsed deterministically, answered from role-scoped database retrieval, and only then narrated by an LLM.</desc>
<defs>
<pattern id="pr-g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#131923" stroke-width="1"/></pattern>
<radialGradient id="pr-glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#F0B55E" stop-opacity=".16"/><stop offset="1" stop-color="#F0B55E" stop-opacity="0"/></radialGradient>
<linearGradient id="pr-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0B55E" stop-opacity="0"/><stop offset=".85" stop-color="#F0B55E" stop-opacity=".14"/><stop offset="1" stop-color="#F0B55E" stop-opacity=".5"/></linearGradient>
<clipPath id="pr-clip"><rect width="1000" height="556" rx="18"/></clipPath>

</defs>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.k{letter-spacing:.14em}
.flow{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.scan{animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(640px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.vf{animation:vf 10s ease-in-out infinite both}
@keyframes vf{0%{opacity:.25}6%{opacity:1}80%{opacity:1}92%,100%{opacity:.25}}
.sc{animation:sc 6s ease-in-out infinite alternate}
@keyframes sc{from{transform:translateX(-30px)}to{transform:translateX(34px)}}
.bp{animation:bp 2.6s ease-in-out infinite}
@keyframes bp{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
</style>
<g clip-path="url(#pr-clip)">
<rect width="1000" height="556" fill="#090B10"/>
<rect width="1000" height="556" fill="url(#pr-g)"/>
<rect width="1000" height="556" fill="url(#pr-glow)"/>
<text x="40" y="94" font-size="38" font-weight="700" fill="#EAF0F8">PRAHARI</text><text class="m" x="42" y="120" font-size="13" fill="#8E99AD">mine safety and compliance monitoring · explainable · traceable</text><rect x="676" y="72" width="284" height="30" rx="15" fill="#0E121A" stroke="#F0B55E" stroke-opacity=".7"/><text class="m k" x="818" y="91" font-size="11" fill="#F0B55E" text-anchor="middle">SMART INDIA HACKATHON</text><rect x="41" y="150" width="150" height="104" rx="8" fill="#0E121A" stroke="#2A3345"/><rect class="vf" style="animation-delay:0.0s" x="41" y="150" width="150" height="104" rx="8" fill="none" stroke="#5FD4C8" stroke-width="1.5"/><text class="m k" x="55" y="174" font-size="10.5" fill="#8E99AD">BLOCK 01</text><text class="m" x="55" y="200" font-size="13" fill="#EAF0F8">hash 9c1e…</text><text class="m" x="55" y="220" font-size="13" fill="#566075">prev a3f9…</text><text class="m" x="55" y="242" font-size="10.5" fill="#8CC8FF">inspection</text><g class="vf" style="animation-delay:0.0s"><circle cx="171" cy="172" r="8" fill="#5FD4C8" fill-opacity=".18" stroke="#5FD4C8"/><path d="M167 172l3 3 6-6" fill="none" stroke="#5FD4C8" stroke-width="1.8"/></g><path class="flow" d="M191 202H233" stroke="#5FD4C8" stroke-width="1.5" fill="none"/><path d="M227 197l6 5-6 5" fill="none" stroke="#5FD4C8"/><rect x="233" y="150" width="150" height="104" rx="8" fill="#0E121A" stroke="#2A3345"/><rect class="vf" style="animation-delay:1.4s" x="233" y="150" width="150" height="104" rx="8" fill="none" stroke="#5FD4C8" stroke-width="1.5"/><text class="m k" x="247" y="174" font-size="10.5" fill="#8E99AD">BLOCK 02</text><text class="m" x="247" y="200" font-size="13" fill="#EAF0F8">hash e04b…</text><text class="m" x="247" y="220" font-size="13" fill="#566075">prev 9c1e…</text><text class="m" x="247" y="242" font-size="10.5" fill="#8CC8FF">violation</text><g class="vf" style="animation-delay:1.4s"><circle cx="363" cy="172" r="8" fill="#5FD4C8" fill-opacity=".18" stroke="#5FD4C8"/><path d="M359 172l3 3 6-6" fill="none" stroke="#5FD4C8" stroke-width="1.8"/></g><path class="flow" d="M383 202H425" stroke="#5FD4C8" stroke-width="1.5" fill="none"/><path d="M419 197l6 5-6 5" fill="none" stroke="#5FD4C8"/><rect x="425" y="150" width="150" height="104" rx="8" fill="#0E121A" stroke="#2A3345"/><rect class="vf" style="animation-delay:2.8s" x="425" y="150" width="150" height="104" rx="8" fill="none" stroke="#5FD4C8" stroke-width="1.5"/><text class="m k" x="439" y="174" font-size="10.5" fill="#8E99AD">BLOCK 03</text><text class="m" x="439" y="200" font-size="13" fill="#EAF0F8">hash 57d2…</text><text class="m" x="439" y="220" font-size="13" fill="#566075">prev e04b…</text><text class="m" x="439" y="242" font-size="10.5" fill="#8CC8FF">alert</text><g class="vf" style="animation-delay:2.8s"><circle cx="555" cy="172" r="8" fill="#5FD4C8" fill-opacity=".18" stroke="#5FD4C8"/><path d="M551 172l3 3 6-6" fill="none" stroke="#5FD4C8" stroke-width="1.8"/></g><path class="flow" d="M575 202H617" stroke="#5FD4C8" stroke-width="1.5" fill="none"/><path d="M611 197l6 5-6 5" fill="none" stroke="#5FD4C8"/><rect x="617" y="150" width="150" height="104" rx="8" fill="#0E121A" stroke="#2A3345"/><rect class="vf" style="animation-delay:4.2s" x="617" y="150" width="150" height="104" rx="8" fill="none" stroke="#5FD4C8" stroke-width="1.5"/><text class="m k" x="631" y="174" font-size="10.5" fill="#8E99AD">BLOCK 04</text><text class="m" x="631" y="200" font-size="13" fill="#EAF0F8">hash b81a…</text><text class="m" x="631" y="220" font-size="13" fill="#566075">prev 57d2…</text><text class="m" x="631" y="242" font-size="10.5" fill="#8CC8FF">report</text><g class="vf" style="animation-delay:4.2s"><circle cx="747" cy="172" r="8" fill="#5FD4C8" fill-opacity=".18" stroke="#5FD4C8"/><path d="M743 172l3 3 6-6" fill="none" stroke="#5FD4C8" stroke-width="1.8"/></g><path class="flow" d="M767 202H809" stroke="#5FD4C8" stroke-width="1.5" fill="none"/><path d="M803 197l6 5-6 5" fill="none" stroke="#5FD4C8"/><rect x="809" y="150" width="150" height="104" rx="8" fill="#0E121A" stroke="#2A3345"/><rect class="vf" style="animation-delay:5.6s" x="809" y="150" width="150" height="104" rx="8" fill="none" stroke="#5FD4C8" stroke-width="1.5"/><text class="m k" x="823" y="174" font-size="10.5" fill="#8E99AD">BLOCK 05</text><text class="m" x="823" y="200" font-size="13" fill="#EAF0F8">hash 4c6d…</text><text class="m" x="823" y="220" font-size="13" fill="#566075">prev b81a…</text><text class="m" x="823" y="242" font-size="10.5" fill="#8CC8FF">risk score</text><g class="vf" style="animation-delay:5.6s"><circle cx="939" cy="172" r="8" fill="#5FD4C8" fill-opacity=".18" stroke="#5FD4C8"/><path d="M935 172l3 3 6-6" fill="none" stroke="#5FD4C8" stroke-width="1.8"/></g><path d="M41 278H959" stroke="#2A3345" stroke-dasharray="2 6"/><circle r="3.5" fill="#5FD4C8" opacity="0"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M41 278H959"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="7s" begin="0s" repeatCount="indefinite"/></circle><text class="m" x="41" y="298" font-size="11.5" fill="#8E99AD">verify walks the hash chain · each row stores a hash chained to the previous one</text><text class="m" x="959" y="298" font-size="10.5" fill="#566075" text-anchor="end">illustrative hashes</text><rect x="40" y="318" width="440" height="186" rx="10" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="56" y="342" font-size="11" fill="#F0B55E">02 · EXPLAINABLE RISK SCORE (0 TO 1)</text><defs><linearGradient id="pr-rk" x1="0" x2="1"><stop offset="0" stop-color="#5FD4C8"/><stop offset=".7" stop-color="#F0B55E"/><stop offset="1" stop-color="#F08A5E"/></linearGradient></defs><rect x="64" y="362" width="392" height="8" rx="4" fill="url(#pr-rk)" opacity=".85"/><path d="M377.6 354v24" stroke="#EAF0F8" stroke-dasharray="2 3"/><text class="m" x="377.6" y="350" font-size="10.5" fill="#EAF0F8" text-anchor="middle">alert at 0.8</text><text class="m" x="64" y="388" font-size="10.5" fill="#566075">0</text><text class="m" x="456" y="388" font-size="10.5" fill="#566075" text-anchor="end">1</text><g class="sc"><path d="M307.03999999999996 358l-6-9h12z" fill="#EAF0F8"/></g><text class="m" x="64" y="408" font-size="11.5" fill="#B8C2D4">findings</text><rect x="240" y="399" width="216" height="8" rx="4" fill="#0B0F16" stroke="#1D2431"/><rect x="240" y="399" width="156" height="8" rx="4" fill="#F0B55E" fill-opacity=".75"/><text class="m" x="64" y="428" font-size="11.5" fill="#B8C2D4">severity keywords</text><rect x="240" y="419" width="216" height="8" rx="4" fill="#0B0F16" stroke="#1D2431"/><rect x="240" y="419" width="119" height="8" rx="4" fill="#F0B55E" fill-opacity=".75"/><text class="m" x="64" y="448" font-size="11.5" fill="#B8C2D4">compliance score</text><rect x="240" y="439" width="216" height="8" rx="4" fill="#0B0F16" stroke="#1D2431"/><rect x="240" y="439" width="82" height="8" rx="4" fill="#F0B55E" fill-opacity=".75"/><text class="m" x="64" y="468" font-size="11.5" fill="#B8C2D4">inspection status</text><rect x="240" y="459" width="216" height="8" rx="4" fill="#0B0F16" stroke="#1D2431"/><rect x="240" y="459" width="134" height="8" rx="4" fill="#F0B55E" fill-opacity=".75"/><text class="m" x="64" y="494" font-size="10.5" fill="#566075">illustrative values · score is stored with its reasons</text><rect x="500" y="318" width="460" height="186" rx="10" fill="#0E121A" stroke="#2A3345"/><text class="m k" x="516" y="342" font-size="11" fill="#F0B55E">03 · PERMISSION-SCOPED COPILOT</text><rect x="520" y="396" width="70" height="48" rx="8" fill="#0B0F16" stroke="#2A3345"/><text class="m" x="555.0" y="417" font-size="12" fill="#EAF0F8" text-anchor="middle">question</text><text class="m" x="555.0" y="433" font-size="10" fill="#8E99AD" text-anchor="middle">role: user</text><rect x="606" y="396" width="86" height="48" rx="8" fill="#0B0F16" stroke="#2A3345"/><text class="m" x="649.0" y="417" font-size="12" fill="#EAF0F8" text-anchor="middle">parse</text><text class="m" x="649.0" y="433" font-size="10" fill="#8E99AD" text-anchor="middle">deterministic</text><rect class="bp" x="706" y="370" width="140" height="100" rx="10" fill="#F0B55E" fill-opacity=".05" stroke="#F0B55E" stroke-dasharray="5 4"/><text class="m k" x="776" y="386" font-size="9.5" fill="#F0B55E" text-anchor="middle">RBAC SCOPE</text><rect x="716" y="396" width="120" height="48" rx="8" fill="#0B0F16" stroke="#2A3345"/><text class="m" x="776.0" y="417" font-size="12" fill="#EAF0F8" text-anchor="middle">retrieve</text><text class="m" x="776.0" y="433" font-size="10" fill="#8E99AD" text-anchor="middle">role-visible mines</text><rect x="864" y="396" width="86" height="48" rx="8" fill="#0B0F16" stroke="#2A3345"/><text class="m" x="907.0" y="417" font-size="12" fill="#EAF0F8" text-anchor="middle">LLM</text><text class="m" x="907.0" y="433" font-size="10" fill="#8E99AD" text-anchor="middle">narrates only</text><path class="flow" d="M590 420H606" stroke="#5FD4C8" stroke-width="1.5"/><path class="flow" d="M692 420H706" stroke="#5FD4C8" stroke-width="1.5"/><path class="flow" d="M846 420H864" stroke="#5FD4C8" stroke-width="1.5"/><circle r="3.2" fill="#C9FFF8" opacity="0"><animateMotion dur="4.5s" begin="0s" repeatCount="indefinite" path="M590 420H950"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4.5s" begin="0s" repeatCount="indefinite"/></circle><text class="m" x="520" y="486" font-size="10.5" fill="#566075">every number in an answer comes from the database</text>

