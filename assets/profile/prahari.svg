<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120" role="img" aria-labelledby="t d">
  <title id="t">PRAHARI</title>
  <desc id="d">Animated hash chain: a verification highlight passes along five linked audit log blocks, ending with chain intact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101524"/><stop offset="1" stop-color="#080A12"/></linearGradient>
  </defs>
  <style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.blk{opacity:0;animation:blk 6s linear infinite}
@keyframes blk{0%{opacity:0}5%{opacity:1}14%{opacity:.35}86%{opacity:.35}94%,100%{opacity:0}}
.a1{animation:a1 6s linear infinite}
.a2{opacity:0;animation:a2 6s linear infinite}
@keyframes a1{0%,64%{opacity:1}68%,94%{opacity:0}98%,100%{opacity:1}}
@keyframes a2{0%,64%{opacity:0}68%,92%{opacity:1}96%,100%{opacity:0}}
  </style>
  <rect x="0.5" y="0.5" width="799" height="119" rx="12" fill="url(#bg)" stroke="#232B3B"/>
  <rect x="28" y="30" width="22" height="2" fill="#5FD4C8"/>
  <text x="28" y="56" font-size="22" font-weight="600" fill="#EEF3FA">PRAHARI</text>
  <text x="28" y="78" font-size="12.5" fill="#8792A6">Mine safety and compliance</text>
  <line x1="414" y1="46" x2="434" y2="46" stroke="#343E52" stroke-width="1.5"/>
  <rect x="350" y="26" width="64" height="40" rx="6" fill="#0B0E18" stroke="#343E52"/>
  <rect class="blk" style="animation-delay:0.0s" x="350" y="26" width="64" height="40" rx="6" fill="#5FD4C8" fill-opacity="0.22" stroke="#5FD4C8"/>
  <text class="m" x="382" y="51" font-size="11" text-anchor="middle" fill="#8792A6">#1</text>
  <line x1="498" y1="46" x2="518" y2="46" stroke="#343E52" stroke-width="1.5"/>
  <rect x="434" y="26" width="64" height="40" rx="6" fill="#0B0E18" stroke="#343E52"/>
  <rect class="blk" style="animation-delay:0.7s" x="434" y="26" width="64" height="40" rx="6" fill="#5FD4C8" fill-opacity="0.22" stroke="#5FD4C8"/>
  <text class="m" x="466" y="51" font-size="11" text-anchor="middle" fill="#8792A6">#2</text>
  <line x1="582" y1="46" x2="602" y2="46" stroke="#343E52" stroke-width="1.5"/>
  <rect x="518" y="26" width="64" height="40" rx="6" fill="#0B0E18" stroke="#343E52"/>
  <rect class="blk" style="animation-delay:1.4s" x="518" y="26" width="64" height="40" rx="6" fill="#5FD4C8" fill-opacity="0.22" stroke="#5FD4C8"/>
  <text class="m" x="550" y="51" font-size="11" text-anchor="middle" fill="#8792A6">#3</text>
  <line x1="666" y1="46" x2="686" y2="46" stroke="#343E52" stroke-width="1.5"/>
  <rect x="602" y="26" width="64" height="40" rx="6" fill="#0B0E18" stroke="#343E52"/>
  <rect class="blk" style="animation-delay:2.1s" x="602" y="26" width="64" height="40" rx="6" fill="#5FD4C8" fill-opacity="0.22" stroke="#5FD4C8"/>
  <text class="m" x="634" y="51" font-size="11" text-anchor="middle" fill="#8792A6">#4</text>
  <rect x="686" y="26" width="64" height="40" rx="6" fill="#0B0E18" stroke="#343E52"/>
  <rect class="blk" style="animation-delay:2.8s" x="686" y="26" width="64" height="40" rx="6" fill="#5FD4C8" fill-opacity="0.22" stroke="#5FD4C8"/>
  <text class="m" x="718" y="51" font-size="11" text-anchor="middle" fill="#8792A6">#5</text>
  <text class="m a1" x="350" y="96" font-size="11.5" fill="#8792A6">verifying audit log hash chain...</text>
  <text class="m a2" x="350" y="96" font-size="11.5" fill="#5FD4C8">chain intact</text>
