="238" r="12" fill="#FFD400" stroke="#111215" stroke-width="2.5"/><path d="M536 238l5 5 9-10" fill="none" stroke="#111215" stroke-width="3"/></g><path d="M574 270H608" stroke="#111215" stroke-width="4"/><path d="M600 262l9 8-9 8" fill="none" stroke="#111215" stroke-width="4"/><rect x="614" y="220" width="152" height="112" rx="0" fill="#111215"/><rect x="608" y="214" width="152" height="112" rx="0" fill="#FDF9F1" stroke="#111215" stroke-width="2.5"/><text class="m" x="620" y="236" font-size="11" fill="#111215">BLOCK 04</text><text class="m" x="620" y="266" font-size="14" fill="#111215">hash b81a…</text><text class="m" x="620" y="286" font-size="13" fill="#111215" fill-opacity=".5">prev 57d2…</text><rect x="620" y="298" width="52" height="20" fill="#FFD400" stroke="#111215" stroke-width="2"/><text class="m" x="627" y="312" font-size="10" fill="#111215">REPORT</text><g class="vf" style="animation-delay:4.2s"><circle cx="734" cy="238" r="12" fill="#FFD400" stroke="#111215" stroke-width="2.5"/><path d="M728 238l5 5 9-10" fill="none" stroke="#111215" stroke-width="3"/></g><path d="M766 270H800" stroke="#111215" stroke-width="4"/><path d="M792 262l9 8-9 8" fill="none" stroke="#111215" stroke-width="4"/><rect x="806" y="220" width="152" height="112" rx="0" fill="#111215"/><rect x="800" y="214" width="152" height="112" rx="0" fill="#FDF9F1" stroke="#111215" stroke-width="2.5"/><text class="m" x="812" y="236" font-size="11" fill="#111215">BLOCK 05</text><text class="m" x="812" y="266" font-size="14" fill="#111215">hash 4c6d…</text><text class="m" x="812" y="286" font-size="13" fill="#111215" fill-opacity=".5">prev b81a…</text><rect x="812" y="298" width="78" height="20" fill="#D8F827" stroke="#111215" stroke-width="2"/><text class="m" x="819" y="312" font-size="10" fill="#111215">RISK SCORE</text><g class="vf" style="animation-delay:5.6s"><circle cx="926" cy="238" r="12" fill="#FFD400" stroke="#111215" stroke-width="2.5"/><path d="M920 238l5 5 9-10" fill="none" stroke="#11121