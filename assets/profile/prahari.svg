roke-width="1.5"/><text class="m" x="278" y="480" font-size="10" fill="#111215">SEVERITY KEYWORDS</text><rect x="278" y="486" width="186" height="10" fill="#EBE5D8" stroke="#111215" stroke-width="1.5"/><rect x="278" y="486" width="102" height="10" fill="#FF6347" stroke="#111215" stroke-width="1.5"/><text class="m" x="278" y="508" font-size="10" fill="#111215">COMPLIANCE SCORE</text><rect x="278" y="514" width="186" height="10" fill="#EBE5D8" stroke="#111215" stroke-width="1.5"/><rect x="278" y="514" width="71" height="10" fill="#FFD400" stroke="#111215" stroke-width="1.5"/><text class="m" x="278" y="536" font-size="10" fill="#111215">INSPECTION STATUS</text><rect x="278" y="542" width="186" height="10" fill="#EBE5D8" stroke="#111215" stroke-width="1.5"/><rect x="278" y="542" width="115" height="10" fill="#FF6347" stroke="#111215" stroke-width="1.5"/><text class="m" x="46" y="586" font-size="10" fill="#111215" fill-opacity=".75">ILLUSTRATIVE VALUES · SCORE IS STORED WITH ITS REASONS</text><rect x="514" y="402" width="460" height="200" rx="0" fill="#111215"/><rect x="508" y="396" width="460" height="200" rx="0" fill="#FDF9F1" stroke="#111215" stroke-width="2.5"/><text class="m" x="522" y="420" font-size="11" fill="#111215">03 · PERMISSION-SCOPED COPILOT</text><rect x="525" y="477" width="66" height="54" fill="#111215"/><rect x="522" y="474" width="66" height="54" fill="#EBE5D8" stroke="#111215" stroke-width="2.5"/><text class="m" x="555.0" y="498" font-size="12" fill="#111215" text-anchor="middle">QUESTION</text><text class="m" x="555.0" y="515" font-size="9" fill="#111215" fill-opacity=".8" text-anchor="middle">USER ROLE</text><rect x="613" y="477" width="84" height="54" fill="#111215"/><rect x="610" y="474" width="84" height="54" fill="#D8F827" stroke="#111215" stroke-width="2.5"/><text class="m" x="652.0" y="498" font-size="12" fill="#111215" text-anchor="middle">PARSE</text><text class="m" x="652.0" y="515" font-size="9" fill="#111215" fill-opacity=".8" text-anchor="middle">DETERMINISTIC</text><rect class="bp" x="712" y="442" width="140" height="116" fill="#FFD400" fill-opacity=".35" stroke="#111215" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="712" y="442" width="86" height="18" fill="#111215"/><text class="m" x="720" y="455" font-size="10" fill="#FFD400">RBAC SCOPE</text><rect x="725" y="477" width="120" height="54" fill="#111215"/><rect x="722" y="474" width="120" height="54" fill="#FDF9F1" stroke="#111215" stroke-width="2.5"/><text class="m" x="782.0" y="498" font-size="12" fill="#111215" text-anchor="middle">RETRIEVE</text><text class="m" x="782.0" y="515" font-size="9" fill="#111215" fill-opacity=".8" text-anchor="middle">ROLE-VISIBLE MINES</text><rect x="877" y="477" width="82" height="54" fill="#111215"/><rect x="874" y="474" width="82" height="54" fill="#1E3AE8" stroke="#111215" stroke-width="2.5"/><text class="m" x="915.0" y="498" font-size="12" fill="#FDF9F1" text-anchor="middle">LLM</text><text class="m" x="915.0" y="515" font-size="9" fill="#FDF9F1" fill-opacity=".8" text-anchor="middle">NARRATES ONLY</text><path class="flow" d="M588 501H610" stroke="#111215" stroke-width="3.5"/><path class="flow" d="M694 501H722" stroke="#111215" stroke-width="3.5"/><path class="flow" d="M842 501H874" stroke="#111215" stroke-width="3.5"/><circle r="6" fill="#FFD400" stroke="#111215" stroke-width="1.8" opacity="0"><animateMotion dur="4.5s" begin="0s" repeatCount="indefinite" path="M588 501H956"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="4.5s" begin="0s" repeatCount="indefinite"/></circle><text class="m" x="522" y="586" font-size="10" fill="#111215" fill-opacity=".75">EVERY NUMBER IN AN ANSWER COMES FROM THE DATABASE</text><text class="m" x="32" y="626" font-size="11" fill="#111215" fill-opacity=".75">Conceptual illustration. Hashes and scores are illustrative, not data from a deployment.</text>
