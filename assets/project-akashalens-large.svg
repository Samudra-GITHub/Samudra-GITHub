<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="akl-glow" cx="26%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E8C878" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#E8C878" stop-opacity="0"/>
    </radialGradient>
    <pattern id="akl-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#262119" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="900" height="380" fill="#F6F0E3"/>
  <rect width="900" height="380" fill="url(#akl-grid)"/>
  <ellipse cx="230" cy="190" rx="260" ry="200" fill="url(#akl-glow)"/>

  <!-- earth -->
  <circle cx="230" cy="190" r="118" fill="none" stroke="#262119" stroke-opacity="0.6"/>
  <ellipse cx="230" cy="190" rx="118" ry="34" fill="none" stroke="#262119" stroke-opacity="0.25"/>
  <ellipse cx="230" cy="190" rx="118" ry="64" fill="none" stroke="#262119" stroke-opacity="0.18"/>
  <path d="M 112 190 L 348 190" stroke="#262119" stroke-opacity="0.2"/>
  <path d="M 230 72 L 230 308" stroke="#262119" stroke-opacity="0.2"/>
  <path d="M 150 110 A 118 118 0 0 1 310 110" fill="none" stroke="#262119" stroke-opacity="0.14"/>

  <!-- occlusion reconstruction patches -->
  <rect x="190" y="150" width="50" height="26" rx="5" fill="#B8902E" opacity="0.4">
    <animate attributeName="opacity" values="0.45;0.08;0.45" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="255" y="205" width="36" height="20" rx="5" fill="#B8902E" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="220" width="30" height="18" rx="4" fill="#B8902E" opacity="0.2">
    <animate attributeName="opacity" values="0.08;0.35;0.08" dur="3.9s" begin="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- scan sweep -->
  <rect x="112" y="72" width="236" height="4" fill="#8A6D22" opacity="0.4">
    <animate attributeName="y" values="72;308;72" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- orbiting satellites -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 230 190" to="360 230 190" dur="9s" repeatCount="indefinite"/>
    <circle cx="365" cy="190" r="3.6" fill="#262119"/>
    <rect x="359" y="184" width="4" height="12" fill="#262119" fill-opacity="0.5"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 230 190" to="0 230 190" dur="14s" repeatCount="indefinite"/>
    <circle cx="230" cy="55" r="2.8" fill="#262119" fill-opacity="0.7"/>
  </g>

  <!-- neural network reconstruction engine -->
  <g stroke="#262119" stroke-opacity="0.28">
    <line x1="560" y1="90" x2="640" y2="120"/>
    <line x1="560" y1="150" x2="640" y2="120"/>
    <line x1="560" y1="150" x2="640" y2="190"/>
    <line x1="560" y1="210" x2="640" y2="190"/>
    <line x1="640" y1="120" x2="730" y2="100"/>
    <line x1="640" y1="120" x2="730" y2="150"/>
    <line x1="640" y1="190" x2="730" y2="150"/>
    <line x1="640" y1="190" x2="730" y2="220"/>
    <line x1="730" y1="100" x2="820" y2="130"/>
    <line x1="730" y1="150" x2="820" y2="130"/>
    <line x1="730" y1="220" x2="820" y2="190"/>
  </g>
  <g fill="#B8902E">
    <circle cx="560" cy="90" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="150" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="210" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="120" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="190" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="100" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="150" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.9s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="220" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="130" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.7s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="190" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.1s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <text x="560" y="60" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#7A6E58">RECONSTRUCTION ENGINE</text>
  <text x="60" y="345" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#5C513E">SATELLITE IMAGERY &#183; CLOUD REMOVAL &#183; IN-FILL</text>
</svg>
