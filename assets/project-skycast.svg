<svg width="400" height="220" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="220" fill="#0a0a0a"/>

  <circle cx="80" cy="55" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.55"/>
  <g stroke="#ffffff" stroke-opacity="0.35">
    <line x1="80" y1="20" x2="80" y2="28"/>
    <line x1="80" y1="82" x2="80" y2="90"/>
    <line x1="45" y1="55" x2="53" y2="55"/>
    <line x1="107" y1="55" x2="115" y2="55"/>
  </g>

  <!-- clouds -->
  <g fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.4">
    <ellipse cx="210" cy="70" rx="46" ry="20"/>
    <ellipse cx="170" cy="78" rx="30" ry="16"/>
    <ellipse cx="250" cy="80" rx="32" ry="16"/>
  </g>

  <!-- rain -->
  <g stroke="#ffffff" stroke-opacity="0.4">
    <line x1="180" y1="100" x2="176" y2="116"><animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="205" y1="102" x2="201" y2="120"><animate attributeName="opacity" values="0.6;0;0.6" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></line>
    <line x1="230" y1="100" x2="226" y2="116"><animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" begin="0.6s" repeatCount="indefinite"/></line>
    <line x1="255" y1="102" x2="251" y2="118"><animate attributeName="opacity" values="0.6;0;0.6" dur="1.7s" begin="0.15s" repeatCount="indefinite"/></line>
  </g>

  <!-- forecast cards -->
  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate(40,150)">
      <rect width="60" height="46" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="30" y="18" text-anchor="middle" font-size="9" fill="#9a9a9a">MON</text>
      <rect x="20" y="26" width="20" height="10" fill="#ffffff" fill-opacity="0.45"/>
    </g>
    <g transform="translate(112,150)">
      <rect width="60" height="46" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="30" y="18" text-anchor="middle" font-size="9" fill="#9a9a9a">TUE</text>
      <rect x="20" y="26" width="20" height="14" fill="#ffffff" fill-opacity="0.6"/>
    </g>
    <g transform="translate(184,150)">
      <rect width="60" height="46" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="30" y="18" text-anchor="middle" font-size="9" fill="#9a9a9a">WED</text>
      <rect x="20" y="26" width="20" height="8" fill="#ffffff" fill-opacity="0.35"/>
    </g>
    <g transform="translate(256,150)">
      <rect width="60" height="46" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="30" y="18" text-anchor="middle" font-size="9" fill="#9a9a9a">THU</text>
      <rect x="20" y="26" width="20" height="12" fill="#ffffff" fill-opacity="0.5"/>
    </g>
  </g>

  <text x="200" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8a8a8a">MINIMAL &#183; CALM &#183; FORECAST</text>
</svg>
