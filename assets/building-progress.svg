<svg width="820" height="280" viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bp-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="bp-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="820" height="280" fill="#050505"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <!-- AI + Computer Vision -->
    <text x="0" y="20" font-size="13" font-weight="600" fill="#e8e8e8">AI + Computer Vision</text>
    <text x="820" y="20" text-anchor="end" font-size="12" fill="#8a8a8a">60%</text>
    <rect x="0" y="32" width="820" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="0" y="32" width="0" height="8" rx="4" fill="url(#bp-fill)" filter="url(#bp-glow)">
      <animate attributeName="width" from="0" to="492" dur="1.6s" begin="0.2s" fill="freeze"/>
    </rect>

    <!-- Three.js / R3F -->
    <text x="0" y="86" font-size="13" font-weight="600" fill="#e8e8e8">Three.js / React Three Fiber</text>
    <text x="820" y="86" text-anchor="end" font-size="12" fill="#8a8a8a">50%</text>
    <rect x="0" y="98" width="820" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="0" y="98" width="0" height="8" rx="4" fill="url(#bp-fill)" filter="url(#bp-glow)">
      <animate attributeName="width" from="0" to="410" dur="1.6s" begin="0.4s" fill="freeze"/>
    </rect>

    <!-- Backend Architecture -->
    <text x="0" y="152" font-size="13" font-weight="600" fill="#e8e8e8">Backend Architecture</text>
    <text x="820" y="152" text-anchor="end" font-size="12" fill="#8a8a8a">70%</text>
    <rect x="0" y="164" width="820" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="0" y="164" width="0" height="8" rx="4" fill="url(#bp-fill)" filter="url(#bp-glow)">
      <animate attributeName="width" from="0" to="574" dur="1.6s" begin="0.6s" fill="freeze"/>
    </rect>

    <!-- Design Systems -->
    <text x="0" y="218" font-size="13" font-weight="600" fill="#e8e8e8">Design Systems</text>
    <text x="820" y="218" text-anchor="end" font-size="12" fill="#8a8a8a">80%</text>
    <rect x="0" y="230" width="820" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="0" y="230" width="0" height="8" rx="4" fill="url(#bp-fill)" filter="url(#bp-glow)">
      <animate attributeName="width" from="0" to="656" dur="1.6s" begin="0.8s" fill="freeze"/>
    </rect>

  </g>
</svg>
