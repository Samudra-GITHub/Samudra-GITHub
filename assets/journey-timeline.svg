<svg width="1100" height="260" viewBox="0 0 1100 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="260" fill="#F8F4EC"/>

  <line x1="60" y1="150" x2="1040" y2="150" stroke="#2D241F" stroke-opacity="0.12" stroke-width="1.4" stroke-dasharray="900" stroke-dashoffset="900">
    <animate attributeName="stroke-dashoffset" from="900" to="0" dur="2.2s" begin="0.1s" fill="freeze"/>
  </line>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- 2024 -->
    <text x="160" y="100" font-size="38" font-weight="800" fill="#2D241F" opacity="0">2024
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/>
    </text>
    <circle cx="160" cy="150" r="6" fill="#2D241F" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/></circle>
    <text x="160" y="182" font-size="12" fill="#75695E" opacity="0">SkyCast<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/></text>
    <text x="160" y="200" font-size="12" fill="#75695E" opacity="0">Portfolio v1<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/></text>

    <!-- 2025 -->
    <text x="450" y="100" font-size="38" font-weight="800" fill="#2D241F" opacity="0">2025
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
    </text>
    <circle cx="450" cy="150" r="6" fill="#2D241F" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/></circle>
    <text x="450" y="182" font-size="12" fill="#75695E" opacity="0">Krama<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/></text>
    <text x="450" y="200" font-size="12" fill="#75695E" opacity="0">AkashaLens &#183; SIH<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/></text>

    <!-- 2026 -->
    <text x="740" y="100" font-size="38" font-weight="800" fill="#C66A2E" opacity="0">2026
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
    </text>
    <circle cx="740" cy="150" r="7" fill="none" stroke="#C66A2E" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="7;13;7" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="150" r="6.5" fill="#C66A2E" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/></circle>
    <text x="740" y="182" font-size="12" fill="#75695E" opacity="0">Tarang &#183; Rinti AI<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/></text>
    <text x="740" y="200" font-size="12" fill="#75695E" opacity="0">Portfolio v2<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/></text>

    <!-- now -->
    <text x="980" y="95" font-size="26" font-weight="800" fill="#C66A2E" opacity="0">NOW
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.2s" fill="freeze"/>
    </text>
    <text x="980" y="182" font-size="12" fill="#75695E" opacity="0">AI &#183; Computer Vision<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/></text>
  </g>
</svg>
