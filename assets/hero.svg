<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F0E3"/>
      <stop offset="100%" stop-color="#EDE2C8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#E8C878" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#E8C878" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E8C878" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#262119" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="330" fill="url(#bg)"/>
  <rect width="900" height="330" fill="url(#grid)"/>
  <circle cx="450" cy="150" r="175" fill="url(#glow)"/>

  <!-- orbiting rings -->
  <circle cx="450" cy="150" r="118" fill="none" stroke="#262119" stroke-opacity="0.1" stroke-dasharray="1 7"/>
  <circle cx="450" cy="150" r="162" fill="none" stroke="#262119" stroke-opacity="0.07" stroke-dasharray="1 5"/>
  <g>
    <circle cx="568" cy="150" r="3" fill="#B8902E"/>
    <animateTransform attributeName="transform" type="rotate" from="0 450 150" to="360 450 150" dur="18s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="288" cy="150" r="2.4" fill="#262119" fill-opacity="0.5"/>
    <animateTransform attributeName="transform" type="rotate" from="360 450 150" to="0 450 150" dur="26s" repeatCount="indefinite"/>
  </g>

  <!-- twinkling flecks -->
  <g fill="#262119">
    <circle cx="90" cy="60" r="1.4"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="230" r="1.1"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="80" r="1.6"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="240" r="1.2"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="270" r="1"><animate attributeName="opacity" values="0.08;0.45;0.08" dur="4.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="140" r="1.3"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="3.9s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name reveal -->
  <text x="450" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="3" fill="#211C15" opacity="0">
    SAMUDRA KAR
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.15s" fill="freeze"/>
  </text>

  <text x="450" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#6B5F48" opacity="0">
    UI/UX DESIGNER &#8212; FULL&#8209;STACK DEVELOPER
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.9s" fill="freeze"/>
  </text>

  <!-- status pill -->
  <g opacity="0">
    <rect x="228" y="228" width="242" height="38" rx="19" fill="#FBF6E9" stroke="#D8C89C"/>
    <circle cx="252" cy="247" r="4.5" fill="#B8902E">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="267" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.3" fill="#3A3226">AVAILABLE FOR WORK</text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.3s" fill="freeze"/>
  </g>

  <!-- location pill -->
  <g opacity="0">
    <rect x="486" y="228" width="186" height="38" rx="19" fill="#FBF6E9" stroke="#D8C89C"/>
    <text x="504" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" fill="#3A3226">BANGALORE, IST</text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.5s" fill="freeze"/>
  </g>
</svg>
