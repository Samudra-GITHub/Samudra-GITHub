<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" fill="url(#bg)"/>
  <rect width="900" height="320" fill="url(#grid)"/>
  <circle cx="450" cy="150" r="170" fill="url(#glow)"/>

  <!-- orbiting rings -->
  <circle cx="450" cy="150" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="1 7"/>
  <circle cx="450" cy="150" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="1 5"/>
  <g>
    <circle cx="568" cy="150" r="2.6" fill="#ffffff" fill-opacity="0.85"/>
    <animateTransform attributeName="transform" type="rotate" from="0 450 150" to="360 450 150" dur="18s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="290" cy="150" r="2" fill="#ffffff" fill-opacity="0.6"/>
    <animateTransform attributeName="transform" type="rotate" from="360 450 150" to="0 450 150" dur="26s" repeatCount="indefinite"/>
  </g>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1.4"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="220" r="1.1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="80" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="230" r="1.2"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="260" r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="140" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="40" r="1"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.3s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="270" r="1.4"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.4s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating particles -->
  <g fill="#ffffff">
    <circle cx="120" cy="150" r="1.6" fill-opacity="0.5">
      <animate attributeName="cy" values="190;90;190" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="170" r="1.8" fill-opacity="0.5">
      <animate attributeName="cy" values="220;110;220" dur="11s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="11s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="260" r="1.4" fill-opacity="0.5">
      <animate attributeName="cy" values="280;170;280" dur="8s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="8s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- name reveal -->
  <text x="450" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="4" fill="#ffffff" opacity="0">
    SAMUDRA KAR
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.15s" fill="freeze"/>
  </text>

  <text x="450" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#9a9a9a" opacity="0">
    UI/UX DESIGNER &#8212; FULL&#8209;STACK DEVELOPER
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.9s" fill="freeze"/>
  </text>

  <!-- status pill -->
  <g opacity="0">
    <rect x="303" y="222" width="150" height="30" rx="15" fill="#101010" stroke="#2a2a2a"/>
    <circle cx="321" cy="237" r="3.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="333" y="241" font-family="Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.4" fill="#d8d8d8">AVAILABLE FOR WORK</text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.3s" fill="freeze"/>
  </g>

  <!-- location pill -->
  <g opacity="0">
    <rect x="459" y="222" width="138" height="30" rx="15" fill="#101010" stroke="#2a2a2a"/>
    <text x="475" y="241" font-family="Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.2" fill="#d8d8d8">BANGALORE, IST</text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.5s" fill="freeze"/>
  </g>

  <rect width="900" height="320" fill="url(#fade)" opacity="0.35"/>
</svg>
