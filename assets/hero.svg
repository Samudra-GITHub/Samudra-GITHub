<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0E1830"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22D3EE" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="360" fill="url(#bg)"/>
  <rect width="900" height="360" fill="url(#grid)"/>
  <circle cx="450" cy="150" r="200" fill="url(#glow)"/>

  <text x="450" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="1" fill="#F1F5F9" opacity="0">
    SAMUDRA KAR
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.15s" fill="freeze"/>
  </text>

  <text x="450" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8" opacity="0">
    Building immersive digital experiences where design, AI and engineering meet.
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.85s" fill="freeze"/>
  </text>

  <!-- status pill -->
  <g opacity="0">
    <rect x="252" y="242" width="200" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="277" cy="262" r="4.5" fill="#22D3EE">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="292" y="267" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="0.6" fill="#E2E8F0">Available for work</text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.3s" fill="freeze"/>
  </g>

  <!-- location pill -->
  <g opacity="0">
    <rect x="460" y="242" width="188" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="480" y="267" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="0.6" fill="#E2E8F0">Bangalore &#183; IST</text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.5s" fill="freeze"/>
  </g>
</svg>
