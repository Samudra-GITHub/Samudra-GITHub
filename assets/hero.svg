<svg width="1200" height="440" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.176  0 0 0 0 0.141  0 0 0 0 0.122  0 0 0 0.02 0"/>
    </filter>
    <radialGradient id="fade-edge" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dot-mask">
      <rect width="1200" height="440" fill="url(#fade-edge)"/>
    </mask>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#2D241F"/>
    </pattern>
  </defs>

  <rect width="1200" height="440" fill="#F8F4EC"/>
  <rect width="1200" height="440" fill="url(#dots)" opacity="0.14" mask="url(#dot-mask)"/>
  <rect width="1200" height="440" filter="url(#grain)"/>

  <!-- drifting background blobs -->
  <g filter="url(#soft-blur)">
    <path fill="#E9C8AA" opacity="0.8" d="M 780 60 C 900 20, 1040 90, 1050 210 C 1060 330, 940 400, 820 380 C 700 360, 640 260, 660 170 C 675 105, 700 90, 780 60 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; 18,-14; 0,0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path fill="#EFE6DA" opacity="0.9" d="M 920 250 C 1030 230, 1120 300, 1100 380 C 1085 440, 990 450, 930 420 C 875 393, 860 300, 920 250 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; -14,16; 0,0" dur="17s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- left column : text -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="64" y="150" font-size="66" font-weight="800" fill="#2D241F" opacity="0">
      SAMUDRA KAR
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.1s" fill="freeze"/>
    </text>

    <text font-size="19" fill="#75695E" opacity="0">
      <tspan x="64" y="192">Building immersive digital experiences where</tspan>
      <tspan x="64" y="218">design, AI and engineering meet.</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
    </text>

    <!-- metadata pills -->
    <g font-size="12.5" letter-spacing="0.4">
      <g opacity="0">
        <rect x="64" y="248" width="112" height="34" rx="17" fill="#EFE6DA" stroke="#2D241F" stroke-opacity="0.08"/>
        <text x="120" y="270" text-anchor="middle" fill="#2D241F">Bangalore</text>
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.0s" fill="freeze"/>
      </g>
      <g opacity="0">
        <rect x="186" y="248" width="86" height="34" rx="17" fill="#EFE6DA" stroke="#2D241F" stroke-opacity="0.08"/>
        <text x="229" y="270" text-anchor="middle" fill="#2D241F">UI/UX</text>
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.15s" fill="freeze"/>
      </g>
      <g opacity="0">
        <rect x="282" y="248" width="118" height="34" rx="17" fill="#EFE6DA" stroke="#2D241F" stroke-opacity="0.08"/>
        <text x="341" y="270" text-anchor="middle" fill="#2D241F">Full Stack</text>
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.3s" fill="freeze"/>
      </g>
      <g opacity="0">
        <rect x="410" y="248" width="128" height="34" rx="17" fill="#C66A2E" fill-opacity="0.12" stroke="#C66A2E" stroke-opacity="0.35"/>
        <text x="474" y="270" text-anchor="middle" fill="#C66A2E">AI Builder</text>
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.45s" fill="freeze"/>
      </g>
    </g>

    <text x="64" y="340" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16" fill="#75695E" opacity="0">
      "Good technology should feel obvious."
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.7s" fill="freeze"/>
    </text>
  </g>

  <!-- right column : editorial collage -->
  <g>
    <!-- polaroid 1 -->
    <g transform="translate(730,60) rotate(-6)">
      <rect width="150" height="176" fill="#FBF8F2" stroke="#2D241F" stroke-opacity="0.08"/>
      <rect x="10" y="10" width="130" height="120" fill="#EFE6DA"/>
      <g stroke="#2D241F" stroke-opacity="0.15"><line x1="10" y1="35" x2="140" y2="130"/><line x1="10" y1="130" x2="140" y2="35"/></g>
      <text x="75" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#75695E">TARANG</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-8; 0,0" dur="6s" repeatCount="indefinite"/>
    </g>
    <!-- polaroid 2 -->
    <g transform="translate(900,150) rotate(5)">
      <rect width="150" height="176" fill="#FBF8F2" stroke="#2D241F" stroke-opacity="0.08"/>
      <rect x="10" y="10" width="130" height="120" fill="#EFE6DA"/>
      <circle cx="75" cy="70" r="34" fill="none" stroke="#2D241F" stroke-opacity="0.18"/>
      <text x="75" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#75695E">KRAMA</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,10; 0,0" dur="7.5s" begin="0.5s" repeatCount="indefinite"/>
    </g>
    <!-- polaroid 3 -->
    <g transform="translate(700,250) rotate(4)">
      <rect width="132" height="156" fill="#FBF8F2" stroke="#2D241F" stroke-opacity="0.08"/>
      <rect x="9" y="9" width="114" height="104" fill="#EFE6DA"/>
      <path d="M20 90 L45 55 L65 78 L85 45 L105 90 Z" fill="none" stroke="#2D241F" stroke-opacity="0.18"/>
      <text x="66" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.5" fill="#75695E">PORTFOLIO</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; -6,8; 0,0" dur="8s" begin="1s" repeatCount="indefinite"/>
    </g>

    <!-- doodles -->
    <g stroke="#C66A2E" stroke-width="1.6" fill="none" opacity="0.7">
      <path d="M1080 90 q6 -14 14 0 q6 14 14 0" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M640 340 l14 -14 m0 14 l-14 -14" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 647 333; 20 647 333; 0 647 333" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M1120 260 c4 -10 16 -10 20 0 c4 10 -6 16 -10 8 c-3 6 -12 2 -10 -8 Z">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="5.5s" begin="0.7s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
