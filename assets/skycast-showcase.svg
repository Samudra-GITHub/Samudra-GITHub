<svg width="620" height="560" viewBox="0 0 620 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sk-spot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E8C878" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#E8C878" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E8C878" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sk-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#262119" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="620" height="560" fill="#F6F0E3"/>
  <rect width="620" height="560" fill="url(#sk-grid)"/>
  <ellipse cx="310" cy="270" rx="260" ry="190" fill="url(#sk-spot)"/>

  <!-- top label -->
  <text x="40" y="46" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#6B5F48">SKYCAST &#8212; WEATHER</text>
  <text x="580" y="46" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#6B5F48">v1.0</text>
  <line x1="40" y1="58" x2="580" y2="58" stroke="#262119" stroke-opacity="0.14"/>

  <!-- dashboard frame -->
  <rect x="90" y="90" width="440" height="320" rx="18" fill="#FBF6E9" stroke="#D8C89C" stroke-width="1.4"/>
  <rect x="90" y="90" width="440" height="46" rx="18" fill="#F0E4C6"/>
  <rect x="90" y="118" width="440" height="18" fill="#F0E4C6"/>
  <circle cx="116" cy="113" r="5" fill="#C9A26A"/>
  <circle cx="134" cy="113" r="5" fill="#D8C08A"/>
  <circle cx="152" cy="113" r="5" fill="#E4D5AC"/>
  <text x="310" y="117" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#6B5F48">BANGALORE, IN</text>

  <!-- sun -->
  <circle cx="180" cy="210" r="26" fill="none" stroke="#B8902E" stroke-opacity="0.8" stroke-width="1.6"/>
  <g stroke="#B8902E" stroke-opacity="0.6" stroke-width="1.6">
    <line x1="180" y1="168" x2="180" y2="178"/>
    <line x1="180" y1="242" x2="180" y2="252"/>
    <line x1="138" y1="210" x2="148" y2="210"/>
    <line x1="212" y1="210" x2="222" y2="210"/>
    <line x1="150" y1="180" x2="157" y2="187"/>
    <line x1="203" y1="233" x2="210" y2="240"/>
  </g>

  <!-- big temperature -->
  <text x="180" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#211C15">27&#176;</text>

  <!-- clouds -->
  <g fill="#EFE4C8" stroke="#262119" stroke-opacity="0.3">
    <ellipse cx="390" cy="200" rx="52" ry="22"/>
    <ellipse cx="345" cy="210" rx="34" ry="18"/>
    <ellipse cx="435" cy="212" rx="36" ry="18"/>
  </g>
  <g stroke="#8A7B5E" stroke-opacity="0.55">
    <line x1="360" y1="238" x2="356" y2="256"><animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="390" y1="240" x2="386" y2="260"><animate attributeName="opacity" values="0.6;0;0.6" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></line>
    <line x1="420" y1="238" x2="416" y2="256"><animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" begin="0.6s" repeatCount="indefinite"/></line>
  </g>
  <text x="390" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1" fill="#6B5F48">LIGHT SHOWERS</text>

  <!-- 7-day forecast strip -->
  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate(112,300)">
      <rect width="56" height="88" rx="8" fill="#F6F0E3" stroke="#D8C89C"/>
      <text x="28" y="20" text-anchor="middle" font-size="10" fill="#6B5F48">MON</text>
      <rect x="18" y="30" width="20" height="34" rx="3" fill="#B8902E" fill-opacity="0.55"/>
      <text x="28" y="78" text-anchor="middle" font-size="10" fill="#4A4133">24&#176;</text>
    </g>
    <g transform="translate(176,300)">
      <rect width="56" height="88" rx="8" fill="#F6F0E3" stroke="#D8C89C"/>
      <text x="28" y="20" text-anchor="middle" font-size="10" fill="#6B5F48">TUE</text>
      <rect x="18" y="18" width="20" height="46" rx="3" fill="#B8902E" fill-opacity="0.75"/>
      <text x="28" y="78" text-anchor="middle" font-size="10" fill="#4A4133">27&#176;</text>
    </g>
    <g transform="translate(240,300)">
      <rect width="56" height="88" rx="8" fill="#F6F0E3" stroke="#D8C89C"/>
      <text x="28" y="20" text-anchor="middle" font-size="10" fill="#6B5F48">WED</text>
      <rect x="18" y="40" width="20" height="24" rx="3" fill="#B8902E" fill-opacity="0.4"/>
      <text x="28" y="78" text-anchor="middle" font-size="10" fill="#4A4133">21&#176;</text>
    </g>
    <g transform="translate(304,300)">
      <rect width="56" height="88" rx="8" fill="#F6F0E3" stroke="#D8C89C"/>
      <text x="28" y="20" text-anchor="middle" font-size="10" fill="#6B5F48">THU</text>
      <rect x="18" y="26" width="20" height="38" rx="3" fill="#B8902E" fill-opacity="0.65"/>
      <text x="28" y="78" text-anchor="middle" font-size="10" fill="#4A4133">25&#176;</text>
    </g>
    <g transform="translate(368,300)">
      <rect width="56" height="88" rx="8" fill="#F6F0E3" stroke="#D8C89C"/>
      <text x="28" y="20" text-anchor="middle" font-size="10" fill="#6B5F48">FRI</text>
      <rect x="18" y="34" width="20" height="30" rx="3" fill="#B8902E" fill-opacity="0.5"/>
      <text x="28" y="78" text-anchor="middle" font-size="10" fill="#4A4133">23&#176;</text>
    </g>
  </g>

  <!-- dimension line -->
  <g stroke="#6B5F48" stroke-opacity="0.75">
    <line x1="90" y1="440" x2="530" y2="440"/>
    <line x1="90" y1="434" x2="90" y2="446"/>
    <line x1="530" y1="434" x2="530" y2="446"/>
  </g>
  <text x="310" y="460" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#6B5F48">7&#8211;DAY FORECAST &#183; LIVE DATA</text>

  <!-- spec markers -->
  <g font-family="Helvetica, Arial, sans-serif">
    <circle cx="90" cy="200" r="10" fill="#F6F0E3" stroke="#211C15" stroke-opacity="0.7"/>
    <text x="90" y="204" text-anchor="middle" font-size="10" fill="#211C15">01</text>
    <line x1="80" y1="200" x2="35" y2="185" stroke="#211C15" stroke-opacity="0.4"/>
    <text x="32" y="181" text-anchor="end" font-size="10.5" letter-spacing="1" fill="#4A4133">CALM PALETTE</text>

    <circle cx="530" cy="210" r="10" fill="#F6F0E3" stroke="#211C15" stroke-opacity="0.7"/>
    <text x="530" y="214" text-anchor="middle" font-size="10" fill="#211C15">02</text>
    <line x1="540" y1="210" x2="585" y2="195" stroke="#211C15" stroke-opacity="0.4"/>
    <text x="588" y="192" font-size="10.5" letter-spacing="1" fill="#4A4133">LIVE RADAR</text>

    <circle cx="310" cy="90" r="10" fill="#F6F0E3" stroke="#211C15" stroke-opacity="0.7"/>
    <text x="310" y="94" text-anchor="middle" font-size="10" fill="#211C15">03</text>
    <line x1="310" y1="80" x2="310" y2="70" stroke="#211C15" stroke-opacity="0.4"/>
    <text x="310" y="64" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="#4A4133">HOURLY BREAKDOWN</text>
  </g>

  <!-- bottom tagline -->
  <line x1="40" y1="500" x2="580" y2="500" stroke="#262119" stroke-opacity="0.14"/>
  <text x="40" y="524" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#332C22">MINIMAL FORECAST.</text>
  <text x="580" y="524" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#332C22">BUILT FOR CLARITY.</text>
</svg>
