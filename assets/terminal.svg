      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="30" y="232"><tspan fill="#8A6D22">&#10095;</tspan> <tspan fill="#211C15">status</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.8s" fill="freeze"/>
    </g>
    <g opacity="0" fill="#5C513E">
      <text x="30" y="258">shipping. always.</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.3s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="30" y="294"><tspan fill="#8A6D22">&#10095;</tspan></text>
      <rect x="48" y="282" width="9" height="17" fill="#211C15">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.9s" fill="freeze"/>
    </g>
