      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
    </g>
    <g opacity="0" fill="#5C513E">
      <text x="30" y="112">Samudra Kar &#8212; UI/UX Designer, Full&#8209;Stack Developer</text>
      <text x="30" y="134">B.Tech CSE &#183; Chanakya University &#183; Bangalore, IN</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="30" y="170"><tspan fill="#8A6D22">&#10095;</tspan> <tspan fill="#211C15">current-focus</tspan></text>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/>
    </g>
    <g opacity="0" fill="#5C513E">
