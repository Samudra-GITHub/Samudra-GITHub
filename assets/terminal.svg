<svg width="620" height="340" viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="winbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF6E9"/>
      <stop offset="100%" stop-color="#F2E9D4"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="600" height="320" rx="14" fill="url(#winbg)" stroke="#D8C89C"/>
  <rect x="10" y="10" width="600" height="36" rx="14" fill="#F0E4C6"/>
  <rect x="10" y="32" width="600" height="14" fill="#F0E4C6"/>

  <circle cx="34" cy="28" r="6.5" fill="#C9A26A"/>
  <circle cx="55" cy="28" r="6.5" fill="#D8C08A"/>
  <circle cx="76" cy="28" r="6.5" fill="#E4D5AC"/>
  <text x="310" y="32" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8A7B5E">samudra — zsh</text>

  <g font-family="Menlo, Consolas, monospace" font-size="16" fill="#2A2419">

