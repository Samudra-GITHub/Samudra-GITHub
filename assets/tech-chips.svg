      <g transform="translate(406,42) rotate(-1)"><rect width="73" height="28" rx="14" fill="#EFE6DA" stroke="#2D241F" stroke-opacity="0.08"/><text x="36" y="19" text-anchor="middle">Python</text><animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-3;0,0" dur="3.8s" begin="0.4s" repeatCount="indefinite"/></g>
