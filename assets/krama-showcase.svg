<svg width="620" height="560" viewBox="0 0 620 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="kr-spot" cx="52%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#E8C878" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#E8C878" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E8C878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kr-upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4133"/>
      <stop offset="100%" stop-color="#211C15"/>
    </linearGradient>
    <linearGradient id="kr-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B5F48"/>
      <stop offset="100%" stop-color="#332C22"/>
    </linearGradient>
    <linearGradient id="kr-sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF6E9"/>
      <stop offset="100%" stop-color="#D8C89C"/>
    </linearGradient>
    <pattern id="kr-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#262119" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="kr-clip">
      <path id="kr-shoe-path" d="M150,255 C200,235 230,225 250,230 C270,223 285,218 300,220 C340,225 380,230 430,245 C480,260 520,275 555,300 C565,315 560,330 545,345 C500,357 450,360 400,355 C350,363 300,367 250,370 C200,368 170,365 150,365 C115,360 95,345 95,325 C93,305 100,275 150,255 Z"/>
    </clipPath>
  </defs>

  <rect width="620" height="560" fill="#F6F0E3"/>
  <rect width="620" height="560" fill="url(#kr-grid)"/>
  <ellipse cx="330" cy="300" rx="260" ry="180" fill="url(#kr-spot)"/>

  <!-- top label -->
  <text x="40" y="46" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#6B5F48">KRAMA &#8212; SS26</text>
  <text x="580" y="46" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#6B5F48">DROP 01</text>
  <line x1="40" y1="58" x2="580" y2="58" stroke="#262119" stroke-opacity="0.14"/>

  <!-- ghost blueprint duplicate -->
  <use href="#kr-shoe-path" transform="translate(14,-16) scale(0.97)" fill="none" stroke="#262119" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- outsole -->
  <path d="M120,355 C160,372 220,380 300,380 C380,380 460,375 520,358 C535,362 542,370 538,378 C480,396 400,402 310,402 C220,402 150,398 105,382 C98,373 105,362 120,355 Z" fill="url(#kr-sole)" stroke="#B8A374" stroke-opacity="0.5"/>
  <g stroke="#8A7B5E" stroke-opacity="0.6" stroke-width="1.2">
    <line x1="150" y1="384" x2="150" y2="394"/>
    <line x1="190" y1="390" x2="190" y2="400"/>
    <line x1="230" y1="393" x2="230" y2="403"/>
    <line x1="270" y1="394" x2="270" y2="404"/>
    <line x1="310" y1="394" x2="310" y2="404"/>
    <line x1="350" y1="393" x2="350" y2="403"/>
    <line x1="390" y1="391" x2="390" y2="401"/>
    <line x1="430" y1="388" x2="430" y2="398"/>
    <line x1="470" y1="383" x2="470" y2="393"/>
  </g>

  <!-- midsole -->
  <path d="M130,340 C180,358 240,365 310,365 C390,365 460,358 515,340 C525,344 528,350 522,356 C465,375 390,382 310,382 C235,382 175,375 128,358 C122,352 124,344 130,340 Z" fill="#EFE4C8" stroke="#C9B98F" stroke-opacity="0.5"/>

  <!-- main upper -->
  <path d="M150,255 C200,235 230,225 250,230 C270,223 285,218 300,220 C340,225 380,230 430,245 C480,260 520,275 555,300 C565,315 560,330 545,345 C500,357 450,360 400,355 C350,363 300,367 250,370 C200,368 170,365 150,365 C115,360 95,345 95,325 C93,305 100,275 150,255 Z"
        fill="url(#kr-upper)" stroke="#0D0A06" stroke-opacity="0.5"/>

  <!-- toe cap panel -->
  <path d="M400,355 C450,360 500,357 545,345 C560,330 565,315 555,300 C520,275 480,260 430,245 C455,275 460,315 430,345 C420,352 410,354 400,355 Z"
        fill="url(#kr-panel)" fill-opacity="0.85" stroke="#0D0A06" stroke-opacity="0.3"/>
  <path d="M430,245 C455,275 460,315 430,345" fill="none" stroke="#0D0A06" stroke-dasharray="2 3" stroke-opacity="0.5"/>

  <!-- heel counter + abstract K-mark -->
  <path d="M95,325 C93,305 100,275 150,255 C130,280 122,310 130,340 C118,338 100,335 95,325 Z"
        fill="url(#kr-panel)" fill-opacity="0.75" stroke="#0D0A06" stroke-opacity="0.3"/>
  <path d="M108,290 L150,278 L138,300 L165,296" fill="none" stroke="#E8C878" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- tongue -->
  <path d="M250,230 C258,218 275,210 300,220 C296,232 285,238 270,236 C262,235 254,233 250,230 Z" fill="#332C22" stroke="#0D0A06" stroke-opacity="0.4"/>

  <!-- eyelets + laces -->
  <g stroke="#EFE4C8" stroke-width="1.6" stroke-opacity="0.9">
    <line x1="262" y1="232" x2="300" y2="248"/>
    <line x1="300" y1="232" x2="262" y2="248"/>
    <line x1="300" y1="238" x2="338" y2="254"/>
    <line x1="338" y1="238" x2="300" y2="254"/>
    <line x1="338" y1="244" x2="374" y2="260"/>
    <line x1="374" y1="244" x2="338" y2="260"/>
  </g>
  <g fill="#F6F0E3">
    <circle cx="262" cy="232" r="2.2"/><circle cx="300" cy="232" r="2.2"/>
    <circle cx="300" cy="238" r="2.2"/><circle cx="338" cy="238" r="2.2"/>
    <circle cx="338" cy="244" r="2.2"/><circle cx="374" cy="244" r="2.2"/>
    <circle cx="262" cy="248" r="2.2"/><circle cx="300" cy="254" r="2.2"/><circle cx="338" cy="260" r="2.2"/>
  </g>

  <!-- stitching -->
  <path d="M150,255 C200,235 230,225 250,230" fill="none" stroke="#0D0A06" stroke-opacity="0.5" stroke-dasharray="1.5 3"/>
  <path d="M150,365 C200,368 250,370 300,367" fill="none" stroke="#0D0A06" stroke-opacity="0.5" stroke-dasharray="1.5 3"/>

  <!-- light sweep -->
  <g clip-path="url(#kr-clip)">
    <rect x="-120" y="180" width="90" height="260" fill="#FFF3D6" opacity="0.32" transform="rotate(18 0 0)">
      <animate attributeName="x" values="-160;620" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- floating orbit dots -->
  <g fill="#B8902E">
    <circle cx="90" cy="200" r="1.8"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="230" r="1.6"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="330" r="1.8"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- dimension line: length -->
  <g stroke="#6B5F48" stroke-opacity="0.75">
    <line x1="95" y1="430" x2="555" y2="430"/>
    <line x1="95" y1="424" x2="95" y2="436"/>
    <line x1="555" y1="424" x2="555" y2="436"/>
  </g>
  <text x="325" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#6B5F48">TOE&#8211;TO&#8211;HEEL &#183; 312MM</text>

  <!-- spec markers -->
  <g font-family="Helvetica, Arial, sans-serif">
    <circle cx="470" cy="290" r="10" fill="#F6F0E3" stroke="#211C15" stroke-opacity="0.7"/>
    <text x="470" y="294" text-anchor="middle" font-size="10" fill="#211C15">01</text>
    <line x1="480" y1="290" x2="520" y2="270" stroke="#211C15" stroke-opacity="0.4"/>
    <text x="524" y="273" font-size="10.5" letter-spacing="1" fill="#4A4133">REINFORCED TOE</text>

    <circle cx="120" cy="300" r="10" fill="#F6F0E3" stroke="#211C15" stroke-opacity="0.7"/>
    <text x="120" y="304" text-anchor="middle" font-size="10" fill="#211C15">02</text>
    <line x1="110" y1="300" x2="55" y2="300" stroke="#211C15" stroke-opacity="0.4"/>
    <text x="52" y="297" text-anchor="end" font-size="10.5" letter-spacing="1" fill="#4A4133">SIGNATURE</text>
    <text x="52" y="309" text-anchor="end" font-size="10.5" letter-spacing="1" fill="#4A4133">COUNTER</text>

    <circle cx="300" cy="236" r="10" fill="#F6F0E3" stroke="#211C15" stroke-opacity="0.7"/>
    <text x="300" y="240" text-anchor="middle" font-size="10" fill="#211C15">03</text>
    <line x1="300" y1="226" x2="300" y2="195" stroke="#211C15" stroke-opacity="0.4"/>
    <text x="300" y="188" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="#4A4133">QUICK&#8209;PULL LACING</text>
  </g>

  <!-- bottom tagline -->
  <line x1="40" y1="500" x2="580" y2="500" stroke="#262119" stroke-opacity="0.14"/>
  <text x="40" y="524" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#332C22">EDITORIAL MARKETPLACE.</text>
  <text x="580" y="524" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#332C22">DESIGNED FOR MOVEMENT.</text>
</svg>
